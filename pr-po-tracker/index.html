<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

const WORKER_URL = 'https://c24-tracker.vicky-bhardwaj.workers.dev/';
const TOOL_PATH  = 'prpo-tracker';

// ── Column indices (0-based from processflows CSV) ────────────────────────
const CI = {
  PR_CODE: 0,   // A
  PR_DATE: 1,   // B
  STATUS:  2,   // C
  SUBJECT: 6,   // G  — Location / Subject
  AMOUNT:  17,  // R  — Total Amount
  CREATED_BY: 22, // W — PR Created By (EMSS POC)
  CUR_PENDING: 28, // AC — Current pending approvals (raw from system)
  L1_BY:   33,  // AH — Approved/Rejected By 1 (L1 approver name)
  L1_DATE: 34,  // AI — Approved/Rejected Date 1 (L1 date)
  BF_BY:   38,  // AM — Approved/Rejected By 2 (BizFin approver)
  BF_DATE: 39,  // AN — Approved/Rejected Date 2 (BizFin date)
};

// ── SCM TAT by value ──────────────────────────────────────────────────────
function scmTAT(amount) {
  if (amount < 100000)   return 1;
  if (amount < 500000)   return 6;
  if (amount < 4000000)  return 7;
  if (amount < 10000000) return 15;
  return 15;
}

// ── Date helpers ──────────────────────────────────────────────────────────
function parseDate(v) {
  if (!v) return null;
  const s = String(v).trim();
  if (!s) return null;
  // DD-MM-YYYY or DD/MM/YYYY
  const m1 = s.match(/^(\d{1,2})[\-\/](\d{1,2})[\-\/](\d{4})$/);
  if (m1) { const [,d,mo,y] = m1; return new Date(+y, +mo-1, +d); }
  // DD/M/YYYY
  const m2 = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (m2) { const [,d,mo,y] = m2; return new Date(+y, +mo-1, +d); }
  const d = new Date(s);
  if (!isNaN(d)) return d;
  return null;
}

function today() {
  const t = new Date();
  return new Date(t.getFullYear(), t.getMonth(), t.getDate());
}

function daysSince(dateVal) {
  if (!dateVal) return null;
  const d = parseDate(dateVal);
  if (!d) return null;
  const diff = Math.floor((today() - d) / 86400000);
  return diff >= 0 ? diff : null;
}

function fmtDate(v) {
  const d = parseDate(v);
  if (!d) return '—';
  return d.toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' });
}

function fmtMoney(v) {
  if (!v) return '—';
  if (v >= 10000000) return `₹${(v/10000000).toFixed(2)} Cr`;
  if (v >= 100000)   return `₹${(v/100000).toFixed(2)} L`;
  if (v >= 1000)     return `₹${(v/1000).toFixed(1)} K`;
  return '₹' + Math.round(v).toLocaleString('en-IN');
}

function uniq(arr) { return [...new Set(arr.filter(Boolean))].sort(); }

// ── Parse CSV into structured rows ────────────────────────────────────────
function parseCSV(text) {
  const res = Papa.parse(text, { skipEmptyLines: true });
  if (!res.data || res.data.length < 2) return [];

  // find header row — look for PR Code in col 0
  let startIdx = 0;
  for (let i = 0; i < Math.min(5, res.data.length); i++) {
    if (String(res.data[i][0] || '').trim() === 'PR Code') { startIdx = i + 1; break; }
  }

  return res.data.slice(startIdx)
    .filter(row => row.length > 5 && String(row[CI.PR_CODE] || '').trim().startsWith('PR-'))
    .map(row => {
      const get = (i) => String(row[i] || '').trim();
      const amount = parseFloat(get(CI.AMOUNT).replace(/[₹,\s]/g,'')) || 0;
      const l1Date = get(CI.L1_DATE);
      const bfDate = get(CI.BF_DATE);
      const l1By   = get(CI.L1_BY);
      const bfBy   = get(CI.BF_BY);
      const prDate = get(CI.PR_DATE);

      // Determine current pending stage
      let pendingStage, pendingLabel;
      if (!l1Date) {
        pendingStage = 'L1';
        pendingLabel = l1By ? `L1 (${l1By.split(' ')[0]})` : 'L1';
      } else if (!bfDate) {
        pendingStage = 'BizFin';
        pendingLabel = bfBy ? `Bizfin (${bfBy.split(' ')[0]})` : 'Bizfin';
      } else {
        pendingStage = 'SCM';
        pendingLabel = 'SCM';
      }

      // Aging
      const agingL1  = (!l1Date) ? daysSince(prDate) : null;
      const agingBF  = (l1Date && !bfDate) ? daysSince(l1Date) : null;
      const agingSCM = (l1Date && bfDate) ? daysSince(bfDate) : null;

      // TAT & %TAT
      let tat = null, pctTAT = null, agingForTAT = null;
      if (pendingStage === 'L1')     { tat = 1; agingForTAT = agingL1; }
      else if (pendingStage === 'BizFin') { tat = 1; agingForTAT = agingBF; }
      else { tat = scmTAT(amount); agingForTAT = agingSCM; }

      if (tat != null && agingForTAT != null) {
        pctTAT = Math.round((agingForTAT / tat) * 100);
      }

      return {
        prCode:       get(CI.PR_CODE),
        prDate,
        status:       get(CI.STATUS),
        location:     get(CI.SUBJECT),
        amount,
        createdBy:    get(CI.CREATED_BY),
        l1By, l1Date,
        bfBy, bfDate,
        pendingStage, pendingLabel,
        agingL1, agingBF, agingSCM,
        tat, pctTAT, agingForTAT,
      };
    });
}

// ── Icons ─────────────────────────────────────────────────────────────────
function Ico({ n, size=16, cls='' }) {
  const icons = {
    upload:  <><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></>,
    search:  <><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></>,
    x:       <><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></>,
    moon:    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>,
    sun:     <><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></>,
    lock:    <><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></>,
    filter:  <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>,
    spin:    <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>,
    refresh: <><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></>,
    home:    <><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></>,
  };
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
      strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={cls}>
      {icons[n]}
    </svg>
  );
}

// ── Toast ─────────────────────────────────────────────────────────────────
function useToast() {
  const [toasts, setToasts] = useState([]);
  const add = useCallback((msg, type='ok') => {
    const id = Date.now();
    setToasts(t => [...t, { id, msg, type }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3500);
  }, []);
  return { toasts, add };
}
function ToastLayer({ toasts }) {
  return (
    <div className="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 items-center pointer-events-none">
      {toasts.map(t => (
        <div key={t.id} className={`px-4 py-2.5 rounded-xl text-sm font-medium shadow-xl fade-in
          ${t.type==='ok' ? 'bg-green-500 text-white' : 'bg-red-500 text-white'}`}>{t.msg}</div>
      ))}
    </div>
  );
}

// ── Login Modal ───────────────────────────────────────────────────────────
function LoginModal({ onSuccess, onClose }) {
  const [user, setUser] = useState('');
  const [pass, setPass] = useState('');
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState('');
  function submit(e) {
    e.preventDefault();
    if (!user || !pass) { setErr('Enter username and password.'); return; }
    setErr(''); setLoading(true);
    window.C24Uploader.verify({ workerUrl: WORKER_URL, auth: { username: user, password: pass } })
      .then(() => onSuccess({ username: user, password: pass }))
      .catch(er => setErr(er.status === 401 ? 'Wrong credentials.' : 'Error: ' + (er.message || er)))
      .finally(() => setLoading(false));
  }
  return (
    <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4" onClick={onClose}>
      <div className="bg-white dark:bg-[#1a1a1a] rounded-2xl shadow-2xl w-full max-w-sm p-6 fade-in" onClick={e=>e.stopPropagation()}>
        <div className="flex items-center gap-3 mb-5">
          <div className="w-9 h-9 rounded-xl bg-[#4736FE]/10 border border-[#4736FE]/30 flex items-center justify-center">
            <Ico n="lock" size={16} cls="text-[#4736FE]"/>
          </div>
          <div><div className="font-bold text-sm">Login to upload</div><div className="text-xs text-gray-400">CARS24 credentials required</div></div>
          <button onClick={onClose} className="ml-auto w-7 h-7 rounded-full flex items-center justify-center text-gray-400 hover:bg-gray-100 dark:hover:bg-white/10"><Ico n="x" size={14}/></button>
        </div>
        <form onSubmit={submit} className="space-y-3">
          <input value={user} onChange={e=>setUser(e.target.value)} placeholder="Username"
            className="w-full px-3 py-2 text-sm rounded-lg border border-gray-200 dark:border-gray-700 bg-transparent focus:outline-none focus:border-[#4736FE]"/>
          <input type="password" value={pass} onChange={e=>setPass(e.target.value)} placeholder="Password"
            className="w-full px-3 py-2 text-sm rounded-lg border border-gray-200 dark:border-gray-700 bg-transparent focus:outline-none focus:border-[#4736FE]"/>
          {err && <p className="text-xs text-red-400">{err}</p>}
          <button type="submit" disabled={loading}
            className="w-full py-2 rounded-lg bg-[#4736FE] text-white text-sm font-semibold hover:bg-[#3829CC] disabled:opacity-50 flex items-center justify-center gap-2">
            {loading ? <><Ico n="spin" size={14} cls="spin"/> Verifying…</> : 'Login'}
          </button>
        </form>
      </div>
    </div>
  );
}

// ── TAT Cell ──────────────────────────────────────────────────────────────
function TATCell({ pct }) {
  if (pct == null) return <td className="px-3 py-2 text-center text-gray-400 text-xs">—</td>;
  const cls = pct >= 100 ? 'tat-red' : pct >= 70 ? 'tat-amber' : 'tat-green';
  const color = pct >= 100 ? 'text-red-500 font-bold' : pct >= 70 ? 'text-amber-500 font-semibold' : 'text-green-500';
  return (
    <td className={`px-3 py-2 text-center text-xs ${cls}`}>
      <span className={color}>{pct}%</span>
    </td>
  );
}

function AgingCell({ days, tat }) {
  if (days == null) return <td className="px-3 py-2 text-center text-gray-400 text-xs">—</td>;
  const over = tat != null && days > tat;
  return (
    <td className={`px-3 py-2 text-center text-xs font-semibold ${over ? 'text-red-500' : 'text-gray-700 dark:text-gray-300'}`}>
      {days}d
    </td>
  );
}

// ── Pivot Summary ─────────────────────────────────────────────────────────
function PivotTable({ rows }) {
  const counts = useMemo(() => {
    const map = {};
    rows.forEach(r => {
      map[r.pendingLabel] = (map[r.pendingLabel] || 0) + 1;
    });
    const entries = Object.entries(map).sort((a,b) => b[1]-a[1]);
    const total = entries.reduce((s,[,c]) => s+c, 0);
    return { entries, total };
  }, [rows]);

  return (
    <div className="bg-white dark:bg-[#1a1a1a] border border-gray-200 dark:border-gray-800 rounded-xl overflow-hidden text-xs">
      <div className="px-3 py-2 bg-amber-400/20 border-b border-gray-200 dark:border-gray-700 font-bold text-amber-600 dark:text-amber-400 text-[11px] uppercase tracking-wide">
        Pending With — Summary
      </div>
      <table className="w-full">
        <thead>
          <tr className="bg-gray-50 dark:bg-[#111] text-gray-500 dark:text-gray-400">
            <th className="px-3 py-1.5 text-left font-semibold">Current Pending from</th>
            <th className="px-3 py-1.5 text-center font-semibold">Count</th>
          </tr>
        </thead>
        <tbody>
          {counts.entries.map(([label, count]) => (
            <tr key={label} className="border-t border-gray-100 dark:border-gray-800 hover:bg-gray-50 dark:hover:bg-white/5">
              <td className="px-3 py-1.5">{label}</td>
              <td className="px-3 py-1.5 text-center font-bold">{count}</td>
            </tr>
          ))}
          <tr className="border-t-2 border-gray-300 dark:border-gray-600 bg-gray-100 dark:bg-[#111] font-bold">
            <td className="px-3 py-1.5">Grand Total</td>
            <td className="px-3 py-1.5 text-center">{counts.total}</td>
          </tr>
        </tbody>
      </table>
    </div>
  );
}

// ── Status badge ──────────────────────────────────────────────────────────
function StatusBadge({ status }) {
  const s = String(status||'').toLowerCase();
  const map = {
    submitted: 'bg-blue-500/15 text-blue-400 border-blue-500/30',
    processed: 'bg-amber-500/15 text-amber-400 border-amber-500/30',
    completed: 'bg-green-500/15 text-green-400 border-green-500/30',
    cancelled: 'bg-red-500/15 text-red-400 border-red-500/30',
  };
  const cls = map[s] || 'bg-gray-500/15 text-gray-400 border-gray-500/30';
  return <span className={`inline-block px-2 py-0.5 rounded-full text-[10px] font-semibold border ${cls}`}>{status||'—'}</span>;
}

// ── Pending badge ─────────────────────────────────────────────────────────
function PendingBadge({ label, stage }) {
  const map = {
    L1:     'bg-amber-500/15 text-amber-500 border-amber-500/30',
    BizFin: 'bg-purple-500/15 text-purple-400 border-purple-500/30',
    SCM:    'bg-cyan-500/15 text-cyan-400 border-cyan-500/30',
  };
  const cls = map[stage] || 'bg-gray-500/15 text-gray-400 border-gray-500/30';
  return <span className={`inline-block px-2 py-0.5 rounded-full text-[10px] font-semibold border ${cls}`}>{label}</span>;
}

// ── Main App ──────────────────────────────────────────────────────────────
function App() {
  const { toasts, add: toast } = useToast();
  const [dark, setDark] = useState(() => {
    try { return localStorage.getItem('c24-theme') !== 'light'; } catch { return true; }
  });
  const [rows, setRows] = useState([]);
  const [loading, setLoading] = useState(false);
  const [auth, setAuth] = useState(null);
  const [showLogin, setShowLogin] = useState(false);
  const [showUpload, setShowUpload] = useState(false);
  const fileRef = useRef();

  // Filters
  const [fStatus, setFStatus] = useState('');       // PR status (submitted/processed/etc)
  const [fCreatedBy, setFCreatedBy] = useState(''); // EMSS POC
  const [fPending, setFPending]   = useState('');   // pending stage L1/BizFin/SCM
  const [search, setSearch] = useState('');

  useEffect(() => {
    document.documentElement.classList.toggle('dark', dark);
    try { localStorage.setItem('c24-theme', dark ? 'dark' : 'light'); } catch {}
  }, [dark]);

  // Try load from Cloudflare on mount
  useEffect(() => {
    loadFromWorker();
  }, []);

  async function loadFromWorker() {
    setLoading(true);
    try {
      const res = await fetch(`${WORKER_URL}?tool=${TOOL_PATH}`, { method: 'GET' });
      if (res.ok) {
        const text = await res.text();
        if (text && text.trim().startsWith('PR')) {
          const parsed = parseCSV(text);
          if (parsed.length) { setRows(parsed); toast(`Loaded ${parsed.length} PRs from cloud`); }
        }
      }
    } catch (e) { /* silent — user can upload manually */ }
    setLoading(false);
  }

  async function handleFile(file) {
    if (!file) return;
    const text = await file.text();
    const parsed = parseCSV(text);
    if (!parsed.length) { toast('Could not parse CSV — check format', 'err'); return; }
    setRows(parsed);
    toast(`Loaded ${parsed.length} PRs`);
    // upload if authed
    if (auth) uploadToWorker(text, auth);
  }

  async function uploadToWorker(text, creds) {
    try {
      await window.C24Uploader.upload({
        workerUrl: WORKER_URL,
        toolPath: TOOL_PATH,
        content: text,
        auth: creds,
      });
      toast('Saved to cloud ✓');
    } catch (e) { toast('Cloud save failed: ' + (e.message || e), 'err'); }
  }

  // Filter options
  const statusOpts  = useMemo(() => uniq(rows.map(r => r.status)), [rows]);
  const createdOpts = useMemo(() => uniq(rows.map(r => r.createdBy)), [rows]);
  const pendingOpts = ['L1', 'BizFin', 'SCM'];

  const filtered = useMemo(() => {
    let out = rows;
    if (fStatus)    out = out.filter(r => r.status === fStatus);
    if (fCreatedBy) out = out.filter(r => r.createdBy === fCreatedBy);
    if (fPending)   out = out.filter(r => r.pendingStage === fPending);
    if (search) {
      const q = search.toLowerCase();
      out = out.filter(r =>
        r.location.toLowerCase().includes(q) ||
        r.prCode.toLowerCase().includes(q) ||
        r.createdBy.toLowerCase().includes(q) ||
        r.pendingLabel.toLowerCase().includes(q)
      );
    }
    return out;
  }, [rows, fStatus, fCreatedBy, fPending, search]);

  const totalAmt = useMemo(() => filtered.reduce((s,r) => s+r.amount, 0), [filtered]);

  function Sel({ val, setVal, opts, placeholder }) {
    return (
      <select value={val} onChange={e=>setVal(e.target.value)}
        className="text-xs px-2.5 py-1.5 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-[#1a1a1a] focus:outline-none focus:border-[#4736FE] cursor-pointer">
        <option value="">{placeholder}</option>
        {opts.map(o => <option key={o} value={o}>{o}</option>)}
      </select>
    );
  }

  return (
    <div className="flex flex-col min-h-screen">
      {/* Header */}
      <header className="sticky top-0 z-30 bg-white/90 dark:bg-[#0f0f0f]/90 backdrop-blur border-b border-gray-200 dark:border-gray-800 px-4 py-2.5 flex items-center gap-3">
        <a href="/" className="w-8 h-8 rounded-lg bg-[#4736FE]/10 border border-[#4736FE]/30 flex items-center justify-center text-[#4736FE] hover:bg-[#4736FE]/20 transition-colors">
          <Ico n="home" size={15}/>
        </a>
        <div>
          <div className="font-bold text-sm leading-tight">PR Approval Tracker</div>
          <div className="text-[10px] text-gray-400">CARS24 · Expansion &amp; Projects</div>
        </div>

        <div className="ml-auto flex items-center gap-2">
          {rows.length > 0 && (
            <span className="text-xs text-gray-400 hidden sm:block">{rows.length} PRs · {fmtMoney(totalAmt)} filtered</span>
          )}

          {/* Upload */}
          <div className="relative">
            <button
              onClick={() => { if (auth) { setShowUpload(v => !v); } else { setShowLogin(true); setShowUpload(true); } }}
              className="flex items-center gap-1.5 text-xs px-3 py-1.5 rounded-lg bg-[#4736FE]/10 border border-[#4736FE]/30 text-[#4736FE] hover:bg-[#4736FE]/20 transition-colors font-semibold">
              <Ico n="upload" size={13}/> Upload CSV
            </button>
            {showUpload && auth && (
              <div className="absolute right-0 top-full mt-1 bg-white dark:bg-[#1a1a1a] border border-gray-200 dark:border-gray-700 rounded-xl shadow-xl p-4 w-56 z-50 fade-in">
                <p className="text-xs text-gray-500 mb-3">Upload processflows.ai PR export (CSV)</p>
                <input ref={fileRef} type="file" accept=".csv" className="hidden"
                  onChange={e => { handleFile(e.target.files[0]); setShowUpload(false); }}/>
                <button onClick={()=>fileRef.current.click()}
                  className="w-full py-2 rounded-lg bg-[#4736FE] text-white text-xs font-semibold hover:bg-[#3829CC]">
                  Choose file…
                </button>
                <button onClick={()=>setShowUpload(false)} className="w-full mt-2 py-1.5 text-xs text-gray-400 hover:text-gray-600">Cancel</button>
              </div>
            )}
          </div>

          <button onClick={() => setDark(d => !d)}
            className="w-8 h-8 rounded-lg border border-gray-200 dark:border-gray-700 flex items-center justify-center text-gray-500 hover:bg-gray-100 dark:hover:bg-white/10 transition-colors">
            <Ico n={dark ? 'sun' : 'moon'} size={15}/>
          </button>
        </div>
      </header>

      {/* Filters bar */}
      <div className="bg-white dark:bg-[#0f0f0f] border-b border-gray-200 dark:border-gray-800 px-4 py-2 flex flex-wrap items-center gap-2">
        <Ico n="filter" size={13} cls="text-gray-400 shrink-0"/>
        <div className="relative">
          <Ico n="search" size={13} cls="absolute left-2.5 top-1/2 -translate-y-1/2 text-gray-400"/>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search PRs…"
            className="pl-8 pr-3 py-1.5 text-xs rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-[#1a1a1a] focus:outline-none focus:border-[#4736FE] w-44"/>
        </div>
        <Sel val={fStatus} setVal={setFStatus} opts={statusOpts} placeholder="All Statuses"/>
        <Sel val={fCreatedBy} setVal={setFCreatedBy} opts={createdOpts} placeholder="All EMSS POC"/>
        <Sel val={fPending} setVal={setFPending} opts={pendingOpts} placeholder="All Pending With"/>
        {(fStatus || fCreatedBy || fPending || search) && (
          <button onClick={() => { setFStatus(''); setFCreatedBy(''); setFPending(''); setSearch(''); }}
            className="text-xs text-gray-400 hover:text-red-400 flex items-center gap-1 transition-colors">
            <Ico n="x" size={12}/> Clear
          </button>
        )}
        <span className="ml-auto text-xs text-gray-400">{filtered.length} rows</span>
      </div>

      {/* Main content */}
      <div className="flex flex-1 overflow-hidden">

        {/* Table area */}
        <div className="flex-1 overflow-auto p-4">
          {loading && (
            <div className="flex items-center justify-center gap-2 py-16 text-gray-400 text-sm">
              <Ico n="spin" size={18} cls="spin"/> Loading from cloud…
            </div>
          )}

          {!loading && rows.length === 0 && (
            <div className="flex flex-col items-center justify-center py-20 gap-4 text-gray-400">
              <div className="w-16 h-16 rounded-2xl bg-[#4736FE]/10 border border-[#4736FE]/20 flex items-center justify-center">
                <Ico n="upload" size={28} cls="text-[#4736FE]"/>
              </div>
              <div className="text-center">
                <div className="font-semibold text-base text-gray-600 dark:text-gray-300">No data loaded</div>
                <div className="text-sm mt-1">Upload a PR CSV export from processflows.ai</div>
              </div>
              <button onClick={() => { setShowLogin(true); setShowUpload(true); }}
                className="px-4 py-2 rounded-xl bg-[#4736FE] text-white text-sm font-semibold hover:bg-[#3829CC] transition-colors">
                Upload CSV
              </button>
            </div>
          )}

          {!loading && rows.length > 0 && (
            <div className="rounded-xl border border-gray-200 dark:border-gray-800 overflow-hidden bg-white dark:bg-[#141414] shadow-sm">
              <div className="overflow-x-auto">
                <table className="w-full text-xs">
                  <thead>
                    <tr className="bg-amber-400 text-black">
                      <th className="px-3 py-2.5 text-left font-bold sticky left-0 bg-amber-400">Location</th>
                      <th className="px-3 py-2.5 text-left font-bold">EMSS POC</th>
                      <th className="px-3 py-2.5 text-left font-bold">PR Number</th>
                      <th className="px-3 py-2.5 text-left font-bold">PR Date</th>
                      <th className="px-3 py-2.5 text-right font-bold">PR Value</th>
                      <th className="px-3 py-2.5 text-left font-bold">L1 Approval</th>
                      <th className="px-3 py-2.5 text-left font-bold">BizFin</th>
                      <th className="px-3 py-2.5 text-left font-bold">Current Pending From</th>
                      <th className="px-3 py-2.5 text-center font-bold">Aging L1</th>
                      <th className="px-3 py-2.5 text-center font-bold">Aging BizFin</th>
                      <th className="px-3 py-2.5 text-center font-bold">Aging SCM</th>
                      <th className="px-3 py-2.5 text-center font-bold">TAT</th>
                      <th className="px-3 py-2.5 text-center font-bold">% TAT</th>
                    </tr>
                  </thead>
                  <tbody>
                    {filtered.map((r, i) => (
                      <tr key={r.prCode + i}
                        className={`border-t border-gray-100 dark:border-gray-800 hover:bg-gray-50 dark:hover:bg-white/[0.03] transition-colors ${r.status === 'cancelled' ? 'opacity-50' : ''}`}>
                        <td className="px-3 py-2 loc-cell sticky left-0 bg-white dark:bg-[#141414] font-medium" title={r.location}>
                          <span className="block truncate max-w-[200px]">{r.location || '—'}</span>
                        </td>
                        <td className="px-3 py-2 text-gray-600 dark:text-gray-400">{r.createdBy || '—'}</td>
                        <td className="px-3 py-2 font-mono text-[#4736FE] dark:text-[#8B82FF] font-semibold">{r.prCode}</td>
                        <td className="px-3 py-2 text-gray-500">{fmtDate(r.prDate)}</td>
                        <td className="px-3 py-2 text-right font-semibold">{fmtMoney(r.amount)}</td>
                        <td className="px-3 py-2">
                          {r.l1Date
                            ? <span className="text-green-600 dark:text-green-400">{r.l1By ? r.l1By.split(' ')[0] : ''} · {fmtDate(r.l1Date)}</span>
                            : <span className="text-amber-500 font-semibold">{r.l1By || 'Pending'}</span>
                          }
                        </td>
                        <td className="px-3 py-2">
                          {r.bfDate
                            ? <span className="text-green-600 dark:text-green-400">{r.bfBy ? r.bfBy.split(' ')[0] : ''} · {fmtDate(r.bfDate)}</span>
                            : r.l1Date
                              ? <span className="text-purple-500 font-semibold">{r.bfBy || 'Pending'}</span>
                              : <span className="text-gray-400">—</span>
                          }
                        </td>
                        <td className="px-3 py-2"><PendingBadge label={r.pendingLabel} stage={r.pendingStage}/></td>
                        <AgingCell days={r.agingL1} tat={1}/>
                        <AgingCell days={r.agingBF} tat={1}/>
                        <AgingCell days={r.agingSCM} tat={r.pendingStage==='SCM' ? r.tat : null}/>
                        <td className="px-3 py-2 text-center text-gray-500">{r.tat != null ? r.tat+'d' : '—'}</td>
                        <TATCell pct={r.pctTAT}/>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}
        </div>

        {/* Right sidebar — pivot */}
        {rows.length > 0 && (
          <div className="w-64 shrink-0 border-l border-gray-200 dark:border-gray-800 bg-white dark:bg-[#0f0f0f] p-3 overflow-y-auto hidden lg:block">
            <PivotTable rows={filtered}/>

            {/* TAT legend */}
            <div className="mt-4 bg-gray-50 dark:bg-[#1a1a1a] border border-gray-200 dark:border-gray-800 rounded-xl p-3 text-[11px]">
              <div className="font-bold text-gray-500 uppercase tracking-wide mb-2">SCM TAT Rules</div>
              <div className="space-y-1 text-gray-600 dark:text-gray-400">
                <div className="flex justify-between"><span>&lt; ₹1 L</span><span className="font-semibold">1 day</span></div>
                <div className="flex justify-between"><span>₹1 L – ₹5 L</span><span className="font-semibold">6 days</span></div>
                <div className="flex justify-between"><span>₹5 L – ₹40 L</span><span className="font-semibold">7 days</span></div>
                <div className="flex justify-between"><span>₹40 L – ₹1 Cr</span><span className="font-semibold">15 days</span></div>
                <div className="border-t border-gray-200 dark:border-gray-700 pt-1 mt-1">
                  <div className="flex justify-between"><span>L1 &amp; BizFin TAT</span><span className="font-semibold">1 day each</span></div>
                </div>
              </div>
            </div>

            {/* Color legend */}
            <div className="mt-3 bg-gray-50 dark:bg-[#1a1a1a] border border-gray-200 dark:border-gray-800 rounded-xl p-3 text-[11px]">
              <div className="font-bold text-gray-500 uppercase tracking-wide mb-2">% TAT Color</div>
              <div className="space-y-1">
                <div className="flex items-center gap-2"><span className="w-3 h-3 rounded bg-green-500/30 inline-block"></span><span className="text-gray-600 dark:text-gray-400">&lt; 70% — On track</span></div>
                <div className="flex items-center gap-2"><span className="w-3 h-3 rounded bg-amber-500/30 inline-block"></span><span className="text-gray-600 dark:text-gray-400">70–99% — At risk</span></div>
                <div className="flex items-center gap-2"><span className="w-3 h-3 rounded bg-red-500/30 inline-block"></span><span className="text-gray-600 dark:text-gray-400">≥ 100% — Overdue</span></div>
              </div>
            </div>
          </div>
        )}
      </div>

      {showLogin && !auth && <LoginModal onSuccess={(creds) => { setAuth(creds); setShowLogin(false); }} onClose={() => setShowLogin(false)}/>}
      <ToastLayer toasts={toasts}/>

      {/* Click-outside close for upload dropdown */}
      {showUpload && auth && <div className="fixed inset-0 z-40" onClick={() => setShowUpload(false)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
