<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

// ── Helpers ───────────────────────────────────────────────────────────────

function parseNum(v) {
  if (v == null || v === '') return 0;
  return parseFloat(String(v).replace(/[₹,\s]/g, '')) || 0;
}

const MONTHS = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11,
  january:0,february:1,fabruary:1,march:2,april:3,june:5,july:6,august:7,
  september:8,october:9,november:10,december:11};

function parseDate(v) {
  if (!v) return null;
  const s = String(v).trim().split('&')[0].trim(); // take first date if multiple
  if (!s) return null;
  let d = new Date(s);
  if (!isNaN(d)) return d;
  const m = s.match(/(\d{1,2})[\s\-\/]([A-Za-z]+)[\s\-\/']?(\d{2,4})?/);
  if (m) {
    const day = parseInt(m[1]);
    const mon = MONTHS[m[2].toLowerCase().slice(0,3)];
    let yr = m[3] ? parseInt(m[3]) : 2024;
    if (yr < 100) yr += 2000;
    if (mon !== undefined && day > 0 && day <= 31) return new Date(yr, mon, day);
  }
  return null;
}

function fmtDate(d) {
  if (!d) return '—';
  const dd = d instanceof Date ? d : parseDate(d);
  if (!dd) return String(d) || '—';
  return dd.toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' });
}

function fmtMoney(v, short=false) {
  if (!v || v === 0) return '—';
  if (short) {
    if (v >= 10000000) return `₹${(v/10000000).toFixed(2)}Cr`;
    if (v >= 100000) return `₹${(v/100000).toFixed(2)}L`;
    if (v >= 1000) return `₹${(v/1000).toFixed(1)}K`;
  }
  return '₹' + Math.round(v).toLocaleString('en-IN');
}

function daysDiff(a, b) {
  const da = a instanceof Date ? a : parseDate(a);
  const db = b instanceof Date ? b : parseDate(b);
  if (!da || !db) return null;
  return Math.round((db - da) / 86400000);
}

function rowStatus(r) {
  const rem = String(r['Remarks'] || '').toLowerCase();
  const poSt = String(r['PO Status'] || '').toLowerCase();
  const poNum = String(r['PO Number'] || '').trim();
  if (rem.includes('cancel') || rem.includes('reject') || poSt.includes('cancel')) return 'cancelled';
  const poLow = poNum.toLowerCase();
  if (!poNum || poLow === 'po awaited' || poLow.startsWith('po awaited')) return 'pr_only';
  const bill = String(r['Bill received Date'] || '').trim();
  if (bill) return 'invoiced';
  return 'po_issued';
}

const STATUS_META = {
  cancelled: { label:'Cancelled',  badgeCls:'bg-red-500/15 text-red-500 border border-red-500/30' },
  pr_only:   { label:'PR Issued',  badgeCls:'bg-blue-500/15 text-blue-400 border border-blue-500/30' },
  po_issued: { label:'PO Issued',  badgeCls:'bg-amber-500/15 text-amber-400 border border-amber-500/30' },
  invoiced:  { label:'Invoiced',   badgeCls:'bg-green-500/15 text-green-400 border border-green-500/30' },
};

function uniq(arr) { return [...new Set(arr.filter(Boolean))].sort(); }
function esc(s) { return String(s || ''); }

// ── Upload Screen ──────────────────────────────────────────────────────────

function UploadScreen({ onData, theme, onToggleTheme }) {
  const [drag, setDrag] = useState(false);
  const [err, setErr] = useState('');
  const inputRef = useRef();

  function processFile(file) {
    if (!file) return;
    setErr('');
    Papa.parse(file, {
      skipEmptyLines: true,
      complete: (res) => {
        // Find the header row (contains 'PR Number' or 'Location')
        let headerIdx = -1;
        res.data.forEach((row, i) => {
          if (row.some(c => String(c).trim() === 'PR Number' || String(c).trim() === 'S.No.')) {
            headerIdx = i;
          }
        });
        if (headerIdx === -1) { setErr('Could not find header row. Ensure CSV has a "PR Number" column.'); return; }
        const headers = res.data[headerIdx].map(h => String(h).trim());
        const rows = res.data.slice(headerIdx + 1)
          .filter(row => row.some(c => String(c).trim()))
          .map(row => {
            const obj = {};
            headers.forEach((h, i) => { obj[h] = String(row[i] || '').trim(); });
            return obj;
          })
          .filter(r => r['PR Number'] || r['Location']); // skip truly empty rows
        if (rows.length === 0) { setErr('No data rows found after header.'); return; }
        onData(rows);
      },
      error: (e) => setErr('Parse error: ' + e.message),
    });
  }

  function onDrop(e) {
    e.preventDefault(); setDrag(false);
    processFile(e.dataTransfer.files[0]);
  }

  return (
    <div className="min-h-screen flex flex-col">
      <header className="flex items-center justify-between px-8 py-5 border-b border-gray-200 dark:border-gray-800">
        <div className="flex items-center gap-4">
          <a href="/" className="flex items-center gap-2 text-sm text-gray-500 dark:text-gray-400 hover:text-[#4736FE] transition-colors">
            <Ico n="back" size={15}/> Hub
          </a>
          <div className="w-px h-5 bg-gray-200 dark:bg-gray-700"/>
          <div>
            <div className="font-700 text-base font-bold">PR / PO Tracker</div>
            <div className="text-xs text-gray-400 uppercase tracking-wider">CARS24 Expansion</div>
          </div>
        </div>
        <button onClick={onToggleTheme} className="w-9 h-9 rounded-full border border-gray-200 dark:border-gray-700 flex items-center justify-center text-gray-400 hover:text-[#4736FE] hover:border-[#4736FE] transition-colors">
          {theme === 'dark' ? <Ico n="sun" size={16}/> : <Ico n="moon" size={16}/>}
        </button>
      </header>

      <main className="flex-1 flex flex-col items-center justify-center px-4 py-16">
        <div className="w-full max-w-lg">
          <div className="text-center mb-10">
            <div className="w-16 h-16 rounded-2xl bg-[#4736FE]/10 border border-[#4736FE]/30 flex items-center justify-center mx-auto mb-5">
              <Ico n="file" size={28} cls="text-[#4736FE]"/>
            </div>
            <h1 className="text-2xl font-bold mb-2">Upload PR/PO CSV</h1>
            <p className="text-gray-400 text-sm leading-relaxed max-w-sm mx-auto">
              Export from the PR-PO-Bill Tracker sheet and drop it below. All processing happens in your browser — nothing is uploaded.
            </p>
          </div>

          <div
            onDragOver={e=>{e.preventDefault();setDrag(true)}}
            onDragLeave={()=>setDrag(false)}
            onDrop={onDrop}
            onClick={()=>inputRef.current.click()}
            className={`border-2 border-dashed rounded-2xl p-12 text-center cursor-pointer transition-all
              ${drag ? 'border-[#4736FE] bg-[#4736FE]/5' : 'border-gray-200 dark:border-gray-700 hover:border-[#4736FE]/60 hover:bg-gray-50 dark:hover:bg-white/[0.02]'}`}
          >
            <Ico n="upload" size={36} cls="mx-auto mb-4 text-gray-300 dark:text-gray-600"/>
            <p className="font-semibold text-sm mb-1">Drop CSV file here</p>
            <p className="text-xs text-gray-400">or click to browse</p>
            <input ref={inputRef} type="file" accept=".csv" className="hidden"
              onChange={e => processFile(e.target.files[0])}/>
          </div>

          {err && (
            <div className="mt-4 p-3 rounded-lg bg-red-50 dark:bg-red-500/10 border border-red-200 dark:border-red-500/30 text-red-600 dark:text-red-400 text-sm flex items-center gap-2">
              <Ico n="alert" size={15}/> {err}
            </div>
          )}

          <div className="mt-8 grid grid-cols-4 gap-3">
            {[['S.No.','Row index'],['Location','Site name'],['PR Number','Purchase req.'],['PO Number','Purchase order'],
              ['PR Basic Value','Amount'],['Bill received Date','Invoice date'],['L1 Approval','L1 sign-off'],['Bizfin','BizFin sign-off']
            ].map(([k,v])=>(
              <div key={k} className="p-3 rounded-xl bg-white dark:bg-white/[0.03] border border-gray-100 dark:border-gray-800">
                <div className="text-[10px] font-semibold text-[#4736FE] mb-0.5 truncate">{k}</div>
                <div className="text-[10px] text-gray-400">{v}</div>
              </div>
            ))}
          </div>
        </div>
      </main>
    </div>
  );
}

// ── Metric Cards ──────────────────────────────────────────────────────────

function MetricCard({ label, value, sub, color='indigo', icon }) {
  const colors = {
    indigo: 'bg-[#4736FE]/10 border-[#4736FE]/30 text-[#4736FE]',
    blue:   'bg-blue-500/10 border-blue-500/30 text-blue-400',
    amber:  'bg-amber-500/10 border-amber-500/30 text-amber-400',
    green:  'bg-green-500/10 border-green-500/30 text-green-400',
    red:    'bg-red-500/10 border-red-500/30 text-red-400',
  };
  return (
    <div className="bg-white dark:bg-white/[0.03] border border-gray-100 dark:border-gray-800 rounded-2xl p-5 flex items-start gap-4">
      <div className={`w-10 h-10 rounded-xl border flex items-center justify-center flex-shrink-0 ${colors[color]}`}>
        {icon}
      </div>
      <div className="min-w-0">
        <div className="text-xs text-gray-400 font-medium mb-1 truncate">{label}</div>
        <div className="text-xl font-bold leading-tight">{value}</div>
        {sub && <div className="text-xs text-gray-400 mt-0.5">{sub}</div>}
      </div>
    </div>
  );
}

// ── Filter Panel ──────────────────────────────────────────────────────────

function MultiCheck({ label, options, selected, onChange }) {
  const [open, setOpen] = useState(false);
  const count = selected.size;
  return (
    <div className="relative">
      <button onClick={()=>setOpen(o=>!o)}
        className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium border transition-colors
          ${count>0 ? 'border-[#4736FE] bg-[#4736FE]/10 text-[#4736FE]' : 'border-gray-200 dark:border-gray-700 text-gray-500 dark:text-gray-400 hover:border-gray-300 dark:hover:border-gray-600'}`}>
        <Ico n="filter" size={11}/>
        {label}{count > 0 && ` (${count})`}
      </button>
      {open && (
        <div className="absolute top-full mt-1 left-0 z-30 min-w-[200px] max-w-[280px] bg-white dark:bg-[#1a1a1a] border border-gray-200 dark:border-gray-700 rounded-xl shadow-xl p-2 max-h-64 overflow-y-auto fade-in">
          <div className="flex items-center justify-between px-1 pb-1 mb-1 border-b border-gray-100 dark:border-gray-800">
            <span className="text-[10px] font-semibold text-gray-400 uppercase tracking-wider">{label}</span>
            {count > 0 && <button onClick={()=>onChange(new Set())} className="text-[10px] text-[#4736FE] hover:underline">Clear</button>}
          </div>
          {options.map(o => (
            <label key={o} className="flex items-center gap-2 px-2 py-1.5 rounded-lg hover:bg-gray-50 dark:hover:bg-white/[0.04] cursor-pointer">
              <input type="checkbox" checked={selected.has(o)}
                onChange={e=>{const s=new Set(selected);e.target.checked?s.add(o):s.delete(o);onChange(s);}}
                className="accent-[#4736FE] w-3.5 h-3.5"/>
              <span className="text-xs truncate text-gray-600 dark:text-gray-300">{o}</span>
            </label>
          ))}
        </div>
      )}
    </div>
  );
}

// ── Row Detail Modal ──────────────────────────────────────────────────────

function DetailModal({ row, onClose }) {
  if (!row) return null;
  const st = rowStatus(row);
  const sm = STATUS_META[st];
  const fields = [
    ['Location', row['Location']], ['Cost Center', row['Cost Center']],
    ['EMSS POC', row['EMSS POC']], ['Budget Category', row['Budget Category']],
    ['Type', row['CAPEX / OPEX / AMC']], ['Vendor', row['Vendor Name']],
    ['PR Number', row['PR Number']], ['PR Date', row['PR Date']],
    ['PR Basic Value', fmtMoney(parseNum(row['PR Basic Value']))],
    ['PR Value with GST', fmtMoney(parseNum(row['PR Value with GST']))],
    ['PO Number', row['PO Number']], ['PO Date', row['PO Date']],
    ['PO Basic Value', fmtMoney(parseNum(row['PO Basic Value']))],
    ['PO with GST', fmtMoney(parseNum(row['PO with GST Value']))],
    ['PR→PO Days', row['Diff.days Between PR & PO'] || '—'],
    ['Bill Received', row['Bill received Date']], ['Bill Basic', fmtMoney(parseNum(row['Bill Basic Value']))],
    ['Bill with GST', fmtMoney(parseNum(row['Bill with GST value']))],
    ['Part Pmt Balance', fmtMoney(parseNum(row['Part Payment Balance']))],
    ['L1 Approval', row['L1 Approval']], ['BizFin', row['Bizfin']],
    ['PO Status', row['PO Status']], ['Remarks', row['Remarks']],
    ['Provision', row['Provision']],
  ].filter(([,v]) => v && v !== '0' && v !== '₹0' && v !== '—');

  return (
    <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4" onClick={onClose}>
      <div className="bg-white dark:bg-[#1a1a1a] rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-hidden flex flex-col fade-in"
        onClick={e=>e.stopPropagation()}>
        <div className="flex items-start justify-between p-5 border-b border-gray-100 dark:border-gray-800">
          <div>
            <div className="font-bold text-base mb-1">{row['PR Number'] || '—'}</div>
            <div className="text-sm text-gray-400 mb-2">{row['Location'] || '—'}</div>
            <span className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold ${sm.badgeCls}`}>
              {sm.label}
            </span>
          </div>
          <button onClick={onClose} className="w-8 h-8 rounded-full flex items-center justify-center text-gray-400 hover:bg-gray-100 dark:hover:bg-white/10 transition-colors mt-0.5">
            <Ico n="x" size={16}/>
          </button>
        </div>
        <div className="overflow-y-auto p-5">
          <div className="grid grid-cols-2 gap-3">
            {fields.map(([l, v]) => (
              <div key={l} className="bg-gray-50 dark:bg-white/[0.03] rounded-xl p-3">
                <div className="text-[10px] text-gray-400 font-medium uppercase tracking-wider mb-1">{l}</div>
                <div className="text-sm font-medium break-words">{v || '—'}</div>
              </div>
            ))}
          </div>
          {row['Budget Category'] && (
            <div className="mt-4 p-3 rounded-xl bg-[#4736FE]/5 border border-[#4736FE]/20">
              <div className="text-[10px] text-[#4736FE] font-semibold uppercase tracking-wider mb-1">Budget Category</div>
              <div className="text-sm">{row['Budget Category']}</div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ── Slack Summary Generator ───────────────────────────────────────────────

function SlackPanel({ pendingL1, pendingBizFin }) {
  const today = new Date(); today.setHours(0,0,0,0);
  const [copied, setCopied] = useState(false);

  const l1Over = pendingL1.filter(r => {
    const pr = parseDate(r['PR Date']);
    if (!pr) return false;
    return daysDiff(pr, today) >= 1;
  });
  const bfOver = pendingBizFin.filter(r => {
    const l1 = parseDate(r['L1 Approval']);
    if (!l1) return false;
    return daysDiff(l1, today) >= 1;
  });

  const text = [
    `*PR/PO Approval Status* — ${today.toLocaleDateString('en-IN', {day:'numeric',month:'short',year:'numeric'})}`,
    '',
    l1Over.length > 0
      ? `⚠️ *${l1Over.length} PR${l1Over.length>1?'s':''} pending L1 approval > 24hrs*\n` +
        l1Over.slice(0,10).map(r => `  • \`${r['PR Number']}\` — ${r['Location'] || '—'} (${r['EMSS POC'] || '—'}) — PR: ${r['PR Date'] || '—'}`).join('\n')
      : '✅ No PRs pending L1 approval > 24hrs',
    '',
    bfOver.length > 0
      ? `⚠️ *${bfOver.length} PR${bfOver.length>1?'s':''} pending BizFin approval > 24hrs*\n` +
        bfOver.slice(0,10).map(r => `  • \`${r['PR Number']}\` — ${r['Location'] || '—'} (L1: ${r['L1 Approval'] || '—'})`).join('\n')
      : '✅ No PRs pending BizFin approval > 24hrs',
    '',
    `_Generated by CARS24 PR/PO Tracker_`,
  ].join('\n');

  function copy() {
    navigator.clipboard.writeText(text).then(() => { setCopied(true); setTimeout(() => setCopied(false), 2000); });
  }

  return (
    <div className="bg-white dark:bg-white/[0.03] border border-gray-100 dark:border-gray-800 rounded-2xl p-5 mb-6">
      <div className="flex items-center justify-between mb-4">
        <div className="flex items-center gap-2">
          <div className="w-8 h-8 rounded-lg bg-[#4A154B]/15 flex items-center justify-center">
            <Ico n="slack" size={16} cls="text-[#4A154B] dark:text-purple-400"/>
          </div>
          <div>
            <div className="text-sm font-semibold">Slack Summary</div>
            <div className="text-xs text-gray-400">Auto-generated approval digest</div>
          </div>
        </div>
        <button onClick={copy}
          className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-[#4A154B]/10 dark:bg-purple-500/15 text-[#4A154B] dark:text-purple-400 text-xs font-semibold hover:bg-[#4A154B]/20 dark:hover:bg-purple-500/25 transition-colors border border-[#4A154B]/20 dark:border-purple-500/30">
          <Ico n={copied?'check':'copy'} size={12}/>
          {copied ? 'Copied!' : 'Copy'}
        </button>
      </div>
      <pre className="text-xs text-gray-600 dark:text-gray-300 bg-gray-50 dark:bg-black/30 rounded-xl p-4 overflow-x-auto whitespace-pre-wrap leading-relaxed font-mono">
        {text}
      </pre>
    </div>
  );
}

// ── Approval TAT Table ────────────────────────────────────────────────────

function TatSection({ title, rows, dateKey, dateLabel, color }) {
  const today = new Date(); today.setHours(0,0,0,0);
  if (rows.length === 0) {
    return (
      <div className="bg-white dark:bg-white/[0.03] border border-gray-100 dark:border-gray-800 rounded-2xl p-5 mb-4">
        <div className="flex items-center gap-2 mb-3">
          <Ico n="check" size={16} cls="text-green-400"/>
          <span className="font-semibold text-sm">{title}</span>
        </div>
        <p className="text-sm text-gray-400">No pending approvals ✓</p>
      </div>
    );
  }
  return (
    <div className="bg-white dark:bg-white/[0.03] border border-gray-100 dark:border-gray-800 rounded-2xl overflow-hidden mb-4">
      <div className="px-5 py-4 border-b border-gray-100 dark:border-gray-800 flex items-center gap-2">
        <Ico n="clock" size={16} cls={color==='red'?'text-red-400':'text-amber-400'}/>
        <span className="font-semibold text-sm">{title}</span>
        <span className={`ml-auto text-xs px-2 py-0.5 rounded-full font-semibold ${color==='red'?'bg-red-500/15 text-red-400':'bg-amber-500/15 text-amber-400'}`}>
          {rows.length} pending
        </span>
      </div>
      <div className="overflow-x-auto">
        <table className="w-full text-xs">
          <thead>
            <tr className="border-b border-gray-100 dark:border-gray-800 bg-gray-50 dark:bg-white/[0.02]">
              {['PR Number','Location','POC','PR Date', dateLabel,'TAT (days)','Value'].map(h => (
                <th key={h} className="text-left px-4 py-2.5 text-gray-400 font-semibold uppercase tracking-wider text-[10px]">{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {rows.map((r, i) => {
              const refDate = parseDate(r[dateKey]);
              const tat = refDate ? daysDiff(refDate, today) : null;
              const overdue = tat !== null && tat >= 1;
              return (
                <tr key={i} className={`border-b border-gray-50 dark:border-gray-800/60 transition-colors ${overdue ? 'tat-overdue' : ''}`}>
                  <td className="px-4 py-2.5 font-mono text-[11px] text-[#4736FE]">{r['PR Number']}</td>
                  <td className="px-4 py-2.5 text-gray-600 dark:text-gray-300 max-w-[160px] truncate">{r['Location'] || '—'}</td>
                  <td className="px-4 py-2.5 text-gray-500">{r['EMSS POC'] || '—'}</td>
                  <td className="px-4 py-2.5 text-gray-500">{r['PR Date'] || '—'}</td>
                  <td className="px-4 py-2.5 text-gray-500">{r[dateKey] || '—'}</td>
                  <td className="px-4 py-2.5">
                    {tat !== null ? (
                      <span className={`font-bold ${overdue ? 'text-red-400' : 'text-green-400'}`}>
                        {tat}d{overdue ? ' ⚠' : ''}
                      </span>
                    ) : '—'}
                  </td>
                  <td className="px-4 py-2.5 text-right font-medium">{fmtMoney(parseNum(r['PR Basic Value']), true)}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ── Main Data Table ───────────────────────────────────────────────────────

const PAGE_SIZE = 50;

function DataTable({ rows, onRowClick }) {
  const [page, setPage] = useState(1);
  const pages = Math.ceil(rows.length / PAGE_SIZE);
  const slice = rows.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);

  useEffect(() => { setPage(1); }, [rows.length]);

  const cols = [
    { key: 'S.No.',          label: '#',            width: '40px' },
    { key: 'Location',        label: 'Location',     width: '170px' },
    { key: 'EMSS POC',        label: 'POC',          width: '110px' },
    { key: 'CAPEX / OPEX / AMC', label: 'Type',      width: '70px' },
    { key: 'PR Number',       label: 'PR No.',       width: '160px' },
    { key: 'PR Basic Value',  label: 'PR Value',     width: '100px' },
    { key: 'PR Date',         label: 'PR Date',      width: '90px' },
    { key: 'Vendor Name',     label: 'Vendor',       width: '140px' },
    { key: 'PO Number',       label: 'PO No.',       width: '160px' },
    { key: 'PO Date',         label: 'PO Date',      width: '90px' },
    { key: 'Bill received Date', label: 'Bill Date', width: '90px' },
    { key: 'status',          label: 'Status',       width: '100px' },
  ];

  return (
    <div className="bg-white dark:bg-white/[0.03] border border-gray-100 dark:border-gray-800 rounded-2xl overflow-hidden">
      <div className="flex items-center justify-between px-5 py-3 border-b border-gray-100 dark:border-gray-800">
        <span className="text-xs text-gray-400">{rows.length.toLocaleString()} rows</span>
        <div className="flex items-center gap-1">
          {[['pr_only','PR Issued','text-blue-400'],['po_issued','PO Issued','text-amber-400'],
            ['invoiced','Invoiced','text-green-400'],['cancelled','Cancelled','text-red-400']].map(([s,l,c])=>(
            <span key={s} className={`text-[10px] font-semibold px-2 py-0.5 rounded-full bg-gray-100 dark:bg-white/[0.05] ${c}`}>
              ● {l}
            </span>
          ))}
        </div>
      </div>
      <div className="overflow-x-auto">
        <table className="w-full text-xs min-w-[900px]">
          <thead>
            <tr className="border-b border-gray-100 dark:border-gray-800 bg-gray-50 dark:bg-white/[0.02] sticky top-0">
              {cols.map(c => (
                <th key={c.key} style={{width:c.width,minWidth:c.width}}
                  className="text-left px-3 py-2.5 text-gray-400 font-semibold uppercase tracking-wider text-[10px]">
                  {c.label}
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {slice.map((r, i) => {
              const st = rowStatus(r);
              const sm = STATUS_META[st];
              return (
                <tr key={i}
                  className={`border-b border-gray-50 dark:border-gray-800/60 cursor-pointer hover:brightness-95 dark:hover:brightness-110 transition-all row-${st}`}
                  onClick={() => onRowClick(r)}
                  title="Click for details">
                  <td className="px-3 py-2 text-gray-400">{r['S.No.'] || i+1}</td>
                  <td className="px-3 py-2 font-medium" style={{maxWidth:'170px',overflow:'hidden',textOverflow:'ellipsis'}} title={r['Location']}>{r['Location'] || '—'}</td>
                  <td className="px-3 py-2 text-gray-500" style={{maxWidth:'110px',overflow:'hidden',textOverflow:'ellipsis'}}>{r['EMSS POC'] || '—'}</td>
                  <td className="px-3 py-2">
                    <span className={`px-1.5 py-0.5 rounded text-[10px] font-semibold
                      ${(r['CAPEX / OPEX / AMC']||'').toLowerCase().startsWith('cap') ? 'bg-violet-500/10 text-violet-400' :
                        (r['CAPEX / OPEX / AMC']||'').toLowerCase().startsWith('op') ? 'bg-sky-500/10 text-sky-400' :
                        'bg-gray-100 dark:bg-white/[0.06] text-gray-400'}`}>
                      {(r['CAPEX / OPEX / AMC']||'').split(/[\s\/]/)[0] || '—'}
                    </span>
                  </td>
                  <td className="px-3 py-2 font-mono text-[10px] text-[#4736FE]" style={{maxWidth:'160px',overflow:'hidden',textOverflow:'ellipsis'}} title={r['PR Number']}>{r['PR Number'] || '—'}</td>
                  <td className="px-3 py-2 text-right font-medium">{fmtMoney(parseNum(r['PR Basic Value']), true)}</td>
                  <td className="px-3 py-2 text-gray-400">{r['PR Date'] || '—'}</td>
                  <td className="px-3 py-2 text-gray-500" style={{maxWidth:'140px',overflow:'hidden',textOverflow:'ellipsis'}} title={r['Vendor Name']}>{r['Vendor Name'] || '—'}</td>
                  <td className="px-3 py-2 font-mono text-[10px] text-gray-500" style={{maxWidth:'160px',overflow:'hidden',textOverflow:'ellipsis'}} title={r['PO Number']}>{r['PO Number'] || '—'}</td>
                  <td className="px-3 py-2 text-gray-400">{r['PO Date'] || '—'}</td>
                  <td className="px-3 py-2 text-gray-400">{r['Bill received Date'] || '—'}</td>
                  <td className="px-3 py-2">
                    <span className={`inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-semibold ${sm.badgeCls}`}>
                      {sm.label}
                    </span>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      {pages > 1 && (
        <div className="flex items-center justify-between px-5 py-3 border-t border-gray-100 dark:border-gray-800">
          <span className="text-xs text-gray-400">Page {page} of {pages}</span>
          <div className="flex items-center gap-1">
            <button onClick={()=>setPage(p=>Math.max(1,p-1))} disabled={page===1}
              className="w-7 h-7 rounded-lg flex items-center justify-center disabled:opacity-30 hover:bg-gray-100 dark:hover:bg-white/[0.06] transition-colors text-gray-500">
              <Ico n="chL" size={14}/>
            </button>
            {Array.from({length:Math.min(7,pages)},(_,i)=>{
              let p = i+1;
              if(pages > 7) {
                if(page <= 4) p = i+1;
                else if(page >= pages-3) p = pages-6+i;
                else p = page-3+i;
              }
              return (
                <button key={p} onClick={()=>setPage(p)}
                  className={`w-7 h-7 rounded-lg text-xs font-medium transition-colors
                    ${p===page ? 'bg-[#4736FE] text-white' : 'hover:bg-gray-100 dark:hover:bg-white/[0.06] text-gray-500'}`}>
                  {p}
                </button>
              );
            })}
            <button onClick={()=>setPage(p=>Math.min(pages,p+1))} disabled={page===pages}
              className="w-7 h-7 rounded-lg flex items-center justify-center disabled:opacity-30 hover:bg-gray-100 dark:hover:bg-white/[0.06] transition-colors text-gray-500">
              <Ico n="chR" size={14}/>
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

// ── Dashboard (main view) ─────────────────────────────────────────────────

function Dashboard({ data, onReset, theme, onToggleTheme }) {
  const urlParams = useMemo(() => new URLSearchParams(window.location.search), []);
  const urlCC = urlParams.get('costCenter') || urlParams.get('cost_center') || '';

  const [tab, setTab] = useState('table');
  const [search, setSearch] = useState('');
  const [fTypes, setFTypes]     = useState(urlCC ? new Set() : new Set());
  const [fPOCs, setFPOCs]       = useState(new Set());
  const [fLocations, setFLocations] = useState(urlCC ? new Set() : new Set());
  const [fVendors, setFVendors]   = useState(new Set());
  const [fStatus, setFStatus]    = useState(new Set());
  const [fCostCenter, setFCostCenter] = useState(urlCC ? new Set([urlCC]) : new Set());
  const [detailRow, setDetailRow] = useState(null);
  const [filtersOpen, setFiltersOpen] = useState(false);

  // Build option lists
  const opts = useMemo(() => ({
    types:      uniq(data.map(r => (r['CAPEX / OPEX / AMC']||'').split(/[\s,]+/)[0]).filter(Boolean)),
    pocs:       uniq(data.map(r => r['EMSS POC'])),
    locations:  uniq(data.map(r => r['Location'])),
    vendors:    uniq(data.map(r => r['Vendor Name'])),
    statuses:   ['PR Issued','PO Issued','Invoiced','Cancelled'],
    costCenters: uniq(data.map(r => r['Cost Center'])),
  }), [data]);

  // Filter rows
  const filtered = useMemo(() => {
    let rows = data;
    if (fCostCenter.size > 0)
      rows = rows.filter(r => fCostCenter.has(r['Cost Center']));
    if (fTypes.size > 0)
      rows = rows.filter(r => fTypes.has((r['CAPEX / OPEX / AMC']||'').split(/[\s,]+/)[0]));
    if (fPOCs.size > 0)
      rows = rows.filter(r => fPOCs.has(r['EMSS POC']));
    if (fLocations.size > 0)
      rows = rows.filter(r => fLocations.has(r['Location']));
    if (fVendors.size > 0)
      rows = rows.filter(r => fVendors.has(r['Vendor Name']));
    if (fStatus.size > 0) {
      const stMap = { 'PR Issued':'pr_only', 'PO Issued':'po_issued', 'Invoiced':'invoiced', 'Cancelled':'cancelled' };
      rows = rows.filter(r => fStatus.has(stMap[([...fStatus][0])] || rowStatus(r)) ||
        [...fStatus].some(s => rowStatus(r) === stMap[s]));
    }
    if (search.trim()) {
      const q = search.trim().toLowerCase();
      rows = rows.filter(r =>
        Object.values(r).some(v => String(v).toLowerCase().includes(q))
      );
    }
    return rows;
  }, [data, fCostCenter, fTypes, fPOCs, fLocations, fVendors, fStatus, search]);

  // Metrics
  const metrics = useMemo(() => {
    const active = filtered.filter(r => rowStatus(r) !== 'cancelled');
    const totalPR = active.reduce((s, r) => s + parseNum(r['PR Basic Value']), 0);
    const pendingPOs = active.filter(r => rowStatus(r) === 'pr_only').length;
    const invoicedVal = active.filter(r => rowStatus(r) === 'invoiced')
      .reduce((s, r) => s + parseNum(r['Bill Basic Value']), 0);
    const tatVals = active.map(r => parseFloat(r['Diff.days Between PR & PO'])).filter(v => !isNaN(v) && v > 0 && v < 365);
    const avgTAT = tatVals.length ? Math.round(tatVals.reduce((a,b)=>a+b,0)/tatVals.length) : 0;
    return { totalPR, pendingPOs, invoicedVal, avgTAT, total: filtered.length };
  }, [filtered]);

  // Approval rows
  const pendingL1 = useMemo(() =>
    data.filter(r => {
      const pr = r['PR Number'];
      if (!pr) return false;
      const l1 = r['L1 Approval'];
      return !l1 || !l1.trim();
    }), [data]);

  const pendingBizFin = useMemo(() =>
    data.filter(r => {
      const l1 = r['L1 Approval'];
      if (!l1 || !l1.trim()) return false;
      const bf = r['Bizfin'];
      return !bf || !bf.trim();
    }), [data]);

  const activeFilters = fCostCenter.size + fTypes.size + fPOCs.size + fLocations.size + fVendors.size + fStatus.size;

  function clearFilters() {
    setFCostCenter(new Set()); setFTypes(new Set()); setFPOCs(new Set());
    setFLocations(new Set()); setFVendors(new Set()); setFStatus(new Set()); setSearch('');
  }

  return (
    <div className="min-h-screen flex flex-col">
      {/* Header */}
      <header className="flex items-center justify-between px-6 py-4 border-b border-gray-200 dark:border-gray-800 sticky top-0 z-20 bg-gray-50/90 dark:bg-[#111]/90 backdrop-blur-md">
        <div className="flex items-center gap-4">
          <a href="/" className="flex items-center gap-1.5 text-sm text-gray-400 hover:text-[#4736FE] transition-colors">
            <Ico n="back" size={14}/> Hub
          </a>
          <div className="w-px h-5 bg-gray-200 dark:bg-gray-700"/>
          <div>
            <span className="font-bold text-sm">PR / PO Tracker</span>
            {urlCC && <span className="ml-2 text-xs px-2 py-0.5 rounded-full bg-[#4736FE]/10 text-[#4736FE] font-medium">{urlCC}</span>}
          </div>
        </div>
        <div className="flex items-center gap-2">
          <span className="text-xs text-gray-400 hidden sm:block">{data.length.toLocaleString()} records</span>
          <button onClick={onReset}
            className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium border border-gray-200 dark:border-gray-700 text-gray-500 hover:border-[#4736FE] hover:text-[#4736FE] transition-colors">
            <Ico n="refresh" size={12}/> New CSV
          </button>
          <button onClick={onToggleTheme}
            className="w-8 h-8 rounded-lg border border-gray-200 dark:border-gray-700 flex items-center justify-center text-gray-400 hover:text-[#4736FE] hover:border-[#4736FE] transition-colors">
            {theme === 'dark' ? <Ico n="sun" size={14}/> : <Ico n="moon" size={14}/>}
          </button>
        </div>
      </header>

      <main className="flex-1 px-4 sm:px-6 py-5 max-w-screen-2xl mx-auto w-full">
        {/* Metrics */}
        <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-5">
          <MetricCard label="Total PR Value" value={fmtMoney(metrics.totalPR, true)}
            sub={`${metrics.total} requests`} color="indigo"
            icon={<Ico n="file" size={18} cls="text-[#4736FE]"/>}/>
          <MetricCard label="Pending POs" value={metrics.pendingPOs}
            sub="PRs awaiting PO" color="blue"
            icon={<Ico n="clock" size={18} cls="text-blue-400"/>}/>
          <MetricCard label="Total Invoiced" value={fmtMoney(metrics.invoicedVal, true)}
            sub="Bills processed" color="green"
            icon={<Ico n="check" size={18} cls="text-green-400"/>}/>
          <MetricCard label="Avg PR→PO TAT" value={metrics.avgTAT ? `${metrics.avgTAT}d` : '—'}
            sub="Calendar days" color="amber"
            icon={<Ico n="alert" size={18} cls="text-amber-400"/>}/>
        </div>

        {/* Tab bar */}
        <div className="flex items-center gap-1 mb-5">
          {[['table','📊 Dashboard'],['approval','⏱ Approval TAT']].map(([t,l]) => (
            <button key={t} onClick={() => setTab(t)}
              className={`px-4 py-2 rounded-lg text-sm font-medium transition-colors
                ${tab===t ? 'bg-[#4736FE] text-white' : 'text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-white/[0.05]'}`}>
              {l}
            </button>
          ))}
          {tab === 'approval' && (
            <div className="ml-auto flex items-center gap-2 text-xs text-gray-400">
              <span className="w-2 h-2 rounded-full bg-red-400 inline-block"/> Overdue (&gt;24h)
            </div>
          )}
        </div>

        {/* Dashboard tab */}
        {tab === 'table' && (
          <div className="fade-in">
            {/* Filter bar */}
            <div className="flex flex-wrap items-center gap-2 mb-4">
              <div className="relative flex-1 min-w-[200px] max-w-xs">
                <Ico n="search" size={14} cls="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"/>
                <input value={search} onChange={e=>setSearch(e.target.value)}
                  placeholder="Search anything…"
                  className="w-full pl-9 pr-3 py-1.5 text-xs rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-white/[0.04] focus:outline-none focus:border-[#4736FE] transition-colors"/>
              </div>
              <MultiCheck label="Type"     options={opts.types}       selected={fTypes}      onChange={setFTypes}/>
              <MultiCheck label="POC"      options={opts.pocs}        selected={fPOCs}       onChange={setFPOCs}/>
              <MultiCheck label="Location" options={opts.locations}   selected={fLocations}  onChange={setFLocations}/>
              <MultiCheck label="Vendor"   options={opts.vendors}     selected={fVendors}    onChange={setFVendors}/>
              <MultiCheck label="Status"   options={opts.statuses}    selected={fStatus}     onChange={setFStatus}/>
              <MultiCheck label="Cost Ctr" options={opts.costCenters} selected={fCostCenter} onChange={setFCostCenter}/>
              {activeFilters > 0 && (
                <button onClick={clearFilters}
                  className="flex items-center gap-1 px-3 py-1.5 rounded-lg text-xs font-medium text-red-400 border border-red-400/30 hover:bg-red-500/10 transition-colors">
                  <Ico n="x" size={11}/> Clear ({activeFilters})
                </button>
              )}
            </div>
            <DataTable rows={filtered} onRowClick={setDetailRow}/>
          </div>
        )}

        {/* Approval TAT tab */}
        {tab === 'approval' && (
          <div className="fade-in">
            <SlackPanel pendingL1={pendingL1} pendingBizFin={pendingBizFin}/>
            <TatSection
              title={`Pending L1 Approval (${pendingL1.length})`}
              rows={pendingL1} dateKey="PR Date" dateLabel="PR Date" color="red"/>
            <TatSection
              title={`Pending BizFin Approval — L1 Done (${pendingBizFin.length})`}
              rows={pendingBizFin} dateKey="L1 Approval" dateLabel="L1 Date" color="amber"/>
          </div>
        )}
      </main>

      {detailRow && <DetailModal row={detailRow} onClose={() => setDetailRow(null)}/>}
    </div>
  );
}

// ── Root App ──────────────────────────────────────────────────────────────

function App() {
  const [data, setData] = useState(null);
  const [theme, setTheme] = useState(() => {
    try { return localStorage.getItem('c24-theme') || 'dark'; } catch { return 'dark'; }
  });

  function toggleTheme() {
    const next = theme === 'dark' ? 'light' : 'dark';
    setTheme(next);
    try { localStorage.setItem('c24-theme', next); } catch {}
    if (next === 'dark') document.documentElement.classList.add('dark');
    else document.documentElement.classList.remove('dark');
  }

  return data
    ? <Dashboard data={data} onReset={() => setData(null)} theme={theme} onToggleTheme={toggleTheme}/>
    : <UploadScreen onData={setData} theme={theme} onToggleTheme={toggleTheme}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
