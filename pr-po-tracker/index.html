// ── Helpers ───────────────────────────────────────────────────────────────

function parseNum(v) {
  if (v == null || v === '') return 0;
  return parseFloat(String(v).replace(/[₹,\s]/g, '')) || 0;
}

const MONTHS = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11,
  january:0,february:1,fabruary:1,march:2,april:3,june:5,july:6,august:7,
  september:8,october:9,november:10,december:11};

function parseDate(v) {
  if (!v) return null;
  const s = String(v).trim().split('&')[0].trim();
  if (!s) return null;
  let d = new Date(s);
  if (!isNaN(d)) return d;
  const m = s.match(/(\d{1,2})[\s\-\/]([A-Za-z]+)[\s\-\/']?(\d{2,4})?/);
  if (m) {
    const day = parseInt(m[1]);
    const mon = MONTHS[m[2].toLowerCase().slice(0,3)];
    let yr = m[3] ? parseInt(m[3]) : 2024;
    if (yr < 100) yr += 2000;
    if (mon !== undefined && day > 0 && day <= 31) return new Date(yr, mon, day);
  }
  return null;
}

function fmtMoney(v, short=false) {
  if (!v || v === 0) return '—';
  if (short) {
    if (v >= 10000000) return `₹${(v/10000000).toFixed(2)}Cr`;
    if (v >= 100000) return `₹${(v/100000).toFixed(2)}L`;
    if (v >= 1000) return `₹${(v/1000).toFixed(1)}K`;
  }
  return '₹' + Math.round(v).toLocaleString('en-IN');
}

function daysDiff(a, b) {
  const da = a instanceof Date ? a : parseDate(a);
  const db = b instanceof Date ? b : parseDate(b);
  if (!da || !db) return null;
  return Math.round((db - da) / 86400000);
}

function rowStatus(r) {
  const rem = String(r['Remarks'] || '').toLowerCase();
  const poSt = String(r['PO Status'] || '').toLowerCase();
  const poNum = String(r['PO Number'] || '').trim();
  if (rem.includes('cancel') || rem.includes('reject') || poSt.includes('cancel')) return 'cancelled';
  const poLow = poNum.toLowerCase();
  if (!poNum || poLow === 'po awaited' || poLow.startsWith('po awaited')) return 'pr_only';
  if (String(r['Bill received Date'] || '').trim()) return 'invoiced';
  return 'po_issued';
}

const STATUS_META = {
  cancelled: { label:'Cancelled', badgeCls:'bg-red-500/15 text-red-500 border border-red-500/30' },
  pr_only:   { label:'PR Issued', badgeCls:'bg-blue-500/15 text-blue-400 border border-blue-500/30' },
  po_issued: { label:'PO Issued', badgeCls:'bg-amber-500/15 text-amber-400 border border-amber-500/30' },
  invoiced:  { label:'Invoiced',  badgeCls:'bg-green-500/15 text-green-400 border border-green-500/30' },
};

function parseCSVText(text) {
  const res = Papa.parse(text, { skipEmptyLines: true });
  let hIdx = -1;
  res.data.forEach((row, i) => {
    if (row.some(c => String(c).trim() === 'PR Number' || String(c).trim() === 'S.No.')) hIdx = i;
  });
  if (hIdx === -1) return null;
  const headers = res.data[hIdx].map(h => String(h).trim());
  const rows = res.data.slice(hIdx + 1)
    .filter(row => row.some(c => String(c).trim()))
    .map(row => { const o = {}; headers.forEach((h, i) => { o[h] = String(row[i]||'').trim(); }); return o; })
    .filter(r => r['PR Number'] || r['Location']);
  return rows.length ? rows : null;
}

function uniq(arr) { return [...new Set(arr.filter(Boolean))].sort(); }

function getFY(dateStr) {
  const d = parseDate(dateStr);
  if (!d) return null;
  const m = d.getMonth(); // 0=Jan
  const y = d.getFullYear();
  const fyStart = m >= 3 ? y : y - 1; // Apr=3
  const s2 = String(fyStart).slice(2);
  const e2 = String(fyStart + 1).slice(2);
  return `FY ${s2}-${e2}`;
}

// ── Toast ─────────────────────────────────────────────────────────────────

function useToast() {
  const [toasts, setToasts] = useState([]);
  const add = useCallback((msg, type='ok') => {
    const id = Date.now();
    setToasts(t => [...t, { id, msg, type }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3500);
  }, []);
  return { toasts, add };
}

function ToastLayer({ toasts }) {
  return (
    <div className="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 items-center pointer-events-none">
      {toasts.map(t => (
        <div key={t.id} className={`px-4 py-2.5 rounded-xl text-sm font-medium shadow-xl fade-in
          ${t.type==='ok' ? 'bg-green-500 text-white' : 'bg-red-500 text-white'}`}>
          {t.msg}
        </div>
      ))}
    </div>
  );
}

// ── Login Modal ───────────────────────────────────────────────────────────

function LoginModal({ onSuccess, onClose, toast }) {
  const [user, setUser] = useState('');
  const [pass, setPass] = useState('');
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState('');

  function submit(e) {
    e.preventDefault();
    if (!user || !pass) { setErr('Enter username and password.'); return; }
    setErr(''); setLoading(true);
    window.C24Uploader.verify({ workerUrl: WORKER_URL, auth: { username: user, password: pass } })
      .then(() => { onSuccess({ username: user, password: pass }); })
      .catch(er => { setErr(er.status === 401 ? 'Wrong credentials.' : 'Error: ' + (er.message || er)); })
      .finally(() => setLoading(false));
  }

  return (
    <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4" onClick={onClose}>
      <div className="bg-white dark:bg-[#1a1a1a] rounded-2xl shadow-2xl w-full max-w-sm p-6 fade-in" onClick={e=>e.stopPropagation()}>
        <div className="flex items-center gap-3 mb-5">
          <div className="w-9 h-9 rounded-xl bg-[#4736FE]/10 border border-[#4736FE]/30 flex items-center justify-center">
            <Ico n="lock" size={16} cls="text-[#4736FE]"/>
          </div>
          <div>
            <div className="font-bold text-sm">Login to upload</div>
            <div className="text-xs text-gray-400">CARS24 credentials required</div>
          </div>
          <button onClick={onClose} className="ml-auto w-7 h-7 rounded-full flex items-center justify-center text-gray-400 hover:bg-gray-100 dark:hover:bg-white/10">
            <Ico n="x" size={14}/>
          </button>
        </div>
        <form onSubmit={submit} className="space-y-3">
          <input value={user} onChange={e=>setUser(e.target.value)} placeholder="Username"
            className="w-full px-3 py-2 text-sm rounded-lg border border-gray-200 dark:border-gray-700 bg-transparent focus:outline-none focus:border-[#4736FE] transition-colors"/>
          <input type="password" value={pass} onChange={e=>setPass(e.target.value)} placeholder="Password"
            className="w-full px-3 py-2 text-sm rounded-lg border border-gray-200 dark:border-gray-700 bg-transparent focus:outline-none focus:border-[#4736FE] transition-colors"/>
          {err && <p className="text-xs text-red-400">{err}</p>}
          <button type="submit" disabled={loading}
            className="w-full py-2 rounded-lg bg-[#4736FE] text-white text-sm font-semibold hover:bg-[#3829CC] disabled:opacity-50 transition-colors flex items-center justify-center gap-2">
            {loading ? <><Ico n="spin" size={14} cls="spin"/> Verifying…</> : 'Login'}
          </button>
        </form>
      </div>
    </div>
  );
}

// ── Multi-select filter ───────────────────────────────────────────────────

function MultiCheck({ label, options, selected, onChange }) {
  const [open, setOpen] = useState(false);
  const ref = useRef();
  useEffect(() => {
    function h(e) { if (ref.current && !ref.current.contains(e.target)) setOpen(false); }
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, []);
  const count = selected.size;
  return (
    <div className="relative" ref={ref}>
      <button onClick={()=>setOpen(o=>!o)}
        className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium border transition-colors
          ${count>0 ? 'border-[#4736FE] bg-[#4736FE]/10 text-[#4736FE]' : 'border-gray-200 dark:border-gray-700 text-gray-500 dark:text-gray-400 hover:border-gray-300'}`}>
        <Ico n="filter" size={11}/>{label}{count>0&&` (${count})`}
      </button>
      {open && (
        <div className="absolute top-full mt-1 left-0 z-30 min-w-[200px] max-w-[280px] bg-white dark:bg-[#1a1a1a] border border-gray-200 dark:border-gray-700 rounded-xl shadow-xl p-2 max-h-64 overflow-y-auto fade-in">
          <div className="flex items-center justify-between px-1 pb-1 mb-1 border-b border-gray-100 dark:border-gray-800">
            <span className="text-[10px] font-semibold text-gray-400 uppercase tracking-wider">{label}</span>
            {count>0 && <button onClick={()=>onChange(new Set())} className="text-[10px] text-[#4736FE] hover:underline">Clear</button>}
          </div>
          {options.map(o => (
            <label key={o} className="flex items-center gap-2 px-2 py-1.5 rounded-lg hover:bg-gray-50 dark:hover:bg-white/[0.04] cursor-pointer">
              <input type="checkbox" checked={selected.has(o)}
                onChange={e=>{const s=new Set(selected);e.target.checked?s.add(o):s.delete(o);onChange(s);}}
                className="accent-[#4736FE] w-3.5 h-3.5"/>
              <span className="text-xs truncate text-gray-600 dark:text-gray-300">{o}</span>
            </label>
          ))}
        </div>
      )}
    </div>
  );
}

// ── Row Detail Modal ──────────────────────────────────────────────────────

function DetailModal({ row, onClose }) {
  if (!row) return null;
  const st = rowStatus(row);
  const sm = STATUS_META[st];
  const fields = [
    ['Location',row['Location']],['Cost Center',row['Cost Center']],
    ['EMSS POC',row['EMSS POC']],['Budget Category',row['Budget Category']],
    ['Type',row['CAPEX / OPEX / AMC']],['Vendor',row['Vendor Name']],
    ['PR Number',row['PR Number']],['PR Date',row['PR Date']],
    ['PR Basic Value',fmtMoney(parseNum(row['PR Basic Value']))],
    ['PR Value with GST',fmtMoney(parseNum(row['PR Value with GST']))],
    ['PO Number',row['PO Number']],['PO Date',row['PO Date']],
    ['PO Basic Value',fmtMoney(parseNum(row['PO Basic Value']))],
    ['PO with GST',fmtMoney(parseNum(row['PO with GST Value']))],
    ['PR→PO Days',row['Diff.days Between PR & PO']||'—'],
    ['Bill Received',row['Bill received Date']],
    ['Bill Basic',fmtMoney(parseNum(row['Bill Basic Value']))],
    ['Bill with GST',fmtMoney(parseNum(row['Bill with GST value']))],
    ['Part Pmt Balance',fmtMoney(parseNum(row['Part Payment Balance']))],
    ['L1 Approval',row['L1 Approval']],['BizFin',row['Bizfin']],
    ['PO Status',row['PO Status']],['Remarks',row['Remarks']],
    ['Provision',row['Provision']],
  ].filter(([,v]) => v && v !== '0' && v !== '₹0' && v !== '—');

  return (
    <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4" onClick={onClose}>
      <div className="bg-white dark:bg-[#1a1a1a] rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-hidden flex flex-col fade-in"
        onClick={e=>e.stopPropagation()}>
        <div className="flex items-start justify-between p-5 border-b border-gray-100 dark:border-gray-800">
          <div>
            <div className="font-bold text-base mb-1">{row['PR Number']||'—'}</div>
            <div className="text-sm text-gray-400 mb-2">{row['Location']||'—'}</div>
            <span className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold ${sm.badgeCls}`}>{sm.label}</span>
          </div>
          <button onClick={onClose} className="w-8 h-8 rounded-full flex items-center justify-center text-gray-400 hover:bg-gray-100 dark:hover:bg-white/10 transition-colors mt-0.5">
            <Ico n="x" size={16}/>
          </button>
        </div>
        <div className="overflow-y-auto p-5">
          <div className="grid grid-cols-2 gap-3">
            {fields.map(([l,v]) => (
              <div key={l} className="bg-gray-50 dark:bg-white/[0.03] rounded-xl p-3">
                <div className="text-[10px] text-gray-400 font-medium uppercase tracking-wider mb-1">{l}</div>
                <div className="text-sm font-medium break-words">{v||'—'}</div>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

// ── Slack Summary ─────────────────────────────────────────────────────────

function SlackPanel({ pendingL1, pendingBizFin }) {
  const today = new Date(); today.setHours(0,0,0,0);
  const [copied, setCopied] = useState(false);
  const l1Over = pendingL1.filter(r => { const p=parseDate(r['PR Date']); return p && daysDiff(p,today)>=1; });
  const bfOver = pendingBizFin.filter(r => { const l=parseDate(r['L1 Approval']); return l && daysDiff(l,today)>=1; });
  const text = [
    `*PR/PO Approval Status* — ${today.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}`,
    '',
    l1Over.length>0
      ? `⚠️ *${l1Over.length} PR${l1Over.length>1?'s':''} pending L1 approval > 24hrs*\n`+l1Over.slice(0,10).map(r=>`  • \`${r['PR Number']}\` — ${r['Location']||'—'} (${r['EMSS POC']||'—'}) — PR: ${r['PR Date']||'—'}`).join('\n')
      : '✅ No PRs pending L1 approval > 24hrs',
    '',
    bfOver.length>0

// ── Processflows CSV — column indices (0-based) ───────────────────────────
const PF_CI = {
  PR_CODE:     0,  PR_DATE:    1,  STATUS:     2,  SUBJECT:    6,
  AMOUNT:     17,  CREATED_BY: 22, CUR_PENDING: 28,
  L1_BY:      33,  L1_DATE:    34, BF_BY:      38, BF_DATE:    39,
};

function pfScmTAT(amount) {
  if (amount < 100000) return 1;
  if (amount < 500000) return 6;
  if (amount < 4000000) return 7;
  return 15;
}

function pfDaysSince(dateVal) {
  if (!dateVal) return null;
  const s = String(dateVal).trim();
  const m1 = s.match(/^(\d{1,2})[\-\/](\d{1,2})[\-\/](\d{4})$/);
  const d = m1 ? new Date(+m1[3], +m1[2]-1, +m1[1]) : parseDate(s);
  if (!d || isNaN(d)) return null;
  const t = new Date(); t.setHours(0,0,0,0);
  const diff = Math.floor((t - d) / 86400000);
  return diff >= 0 ? diff : null;
}

function pfFmtDate(v) {
  if (!v) return '—';
  const s = String(v).trim();
  const m1 = s.match(/^(\d{1,2})[\-\/](\d{1,2})[\-\/](\d{4})$/);
  if (m1) return new Date(+m1[3], +m1[2]-1, +m1[1]).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
  return s;
}

function parseProcessflowsCSV(text) {
  const res = Papa.parse(text, { skipEmptyLines: true });
  if (!res.data || res.data.length < 2) return [];
  let startIdx = 0;
  for (let i = 0; i < Math.min(5, res.data.length); i++) {
    if (String(res.data[i][0] || '').trim() === 'PR Code') { startIdx = i + 1; break; }
  }
  return res.data.slice(startIdx)
    .filter(row => row.length > 5 && String(row[PF_CI.PR_CODE] || '').trim().startsWith('PR-'))
    .map(row => {
      const get = i => String(row[i] || '').trim();
      const amount = parseFloat(get(PF_CI.AMOUNT).replace(/[₹,\s]/g,'')) || 0;
      const l1Date = get(PF_CI.L1_DATE), bfDate = get(PF_CI.BF_DATE);
      const l1By = get(PF_CI.L1_BY), bfBy = get(PF_CI.BF_BY);
      const curPending = get(PF_CI.CUR_PENDING); // name of who currently needs to act
      const prDate = get(PF_CI.PR_DATE);
      let pendingStage, pendingLabel;
      if (!l1Date)       { pendingStage='L1';    const nm=curPending||l1By; pendingLabel=nm?`L1 (${nm})`:'L1'; }
      else if (!bfDate)  { pendingStage='BizFin'; const nm=curPending||bfBy; pendingLabel=nm?`Bizfin (${nm})`:'Bizfin'; }
      else               { pendingStage='SCM';    pendingLabel='SCM'; }
      const agingL1  = !l1Date ? pfDaysSince(prDate) : null;
      const agingBF  = l1Date && !bfDate ? pfDaysSince(l1Date) : null;
      const agingSCM = l1Date && bfDate  ? pfDaysSince(bfDate) : null;
      let tat, agingForTAT;
      if (pendingStage==='L1')     { tat=1; agingForTAT=agingL1; }
      else if (pendingStage==='BizFin') { tat=1; agingForTAT=agingBF; }
      else { tat=pfScmTAT(amount); agingForTAT=agingSCM; }
      const pctTAT = tat!=null && agingForTAT!=null ? Math.round((agingForTAT/tat)*100) : null;
      return { prCode:get(PF_CI.PR_CODE), prDate, status:get(PF_CI.STATUS), location:get(PF_CI.SUBJECT),
        amount, createdBy:get(PF_CI.CREATED_BY), l1By, l1Date, bfBy, bfDate,
        pendingStage, pendingLabel, agingL1, agingBF, agingSCM, tat, pctTAT, agingForTAT };
    });
}

  const { entries, total } = useMemo(() => {
    const map = {};

    return { entries, total: entries.reduce((s,[,c])=>s+c,0) };

  return (
    <div className="bg-white dark:bg-white/[0.03] border border-gray-100 dark:border-gray-800 rounded-2xl overflow-hidden text-xs w-64 shrink-0 self-start">

              const typeClsPick=typeVal.toLowerCase().startsWith('cap')?'bg-violet-500/10 text-violet-400':typeVal.toLowerCase().startsWith('op')?'bg-sky-500/10 text-sky-400':'bg-gray-100 dark:bg-white/[0.06] text-gray-400';
              return (
                <tr key={i} className={`border-b border-gray-50 dark:border-gray-800/60 cursor-pointer hover:brightness-95 dark:hover:brightness-110 transition-all row-${st}`}
                  onClick={()=>onRowClick(r)} title="Click for details">
                  <td className="px-3 py-2 text-gray-400">{r['S.No.']||i+1}</td>
                  <td className="px-3 py-2 font-medium" style={{maxWidth:'170px',overflow:'hidden',textOverflow:'ellipsis'}} title={r['Location']}>{r['Location']||'—'}</td>
                  <td className="px-3 py-2 text-gray-500" style={{maxWidth:'110px',overflow:'hidden',textOverflow:'ellipsis'}}>{r['EMSS POC']||'—'}</td>
                  <td className="px-3 py-2"><span className={`px-1.5 py-0.5 rounded text-[10px] font-semibold ${typeClsPick}`}>{typeVal}</span></td>
                  <td className="px-3 py-2 font-mono text-[10px] text-[#4736FE]" style={{maxWidth:'155px',overflow:'hidden',textOverflow:'ellipsis'}} title={r['PR Number']}>{r['PR Number']||'—'}</td>
                  <td className="px-3 py-2 text-right font-medium">{fmtMoney(parseNum(r['PR Basic Value']),true)}</td>
                  <td className="px-3 py-2 text-gray-400">{r['PR Date']||'—'}</td>
                  <td className="px-3 py-2 text-gray-500" style={{maxWidth:'140px',overflow:'hidden',textOverflow:'ellipsis'}} title={r['Vendor Name']}>{r['Vendor Name']||'—'}</td>
                  <td className="px-3 py-2 font-mono text-[10px] text-gray-500" style={{maxWidth:'155px',overflow:'hidden',textOverflow:'ellipsis'}} title={r['PO Number']}>{r['PO Number']||'—'}</td>
                  <td className="px-3 py-2 text-gray-400">{r['PO Date']||'—'}</td>
                  <td className="px-3 py-2 text-gray-400">{r['Bill received Date']||'—'}</td>
                  <td className="px-3 py-2"><span className={`inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-semibold ${sm.badgeCls}`}>{sm.label}</span></td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      {pages > 1 && (
        <div className="flex items-center justify-between px-5 py-3 border-t border-gray-100 dark:border-gray-800">
          <span className="text-xs text-gray-400">Page {page} of {pages}</span>
          <div className="flex items-center gap-1">
            <button onClick={()=>setPage(p=>Math.max(1,p-1))} disabled={page===1}
              className="w-7 h-7 rounded-lg flex items-center justify-center disabled:opacity-30 hover:bg-gray-100 dark:hover:bg-white/[0.06] text-gray-500">
              <Ico n="chL" size={14}/>
            </button>
            {Array.from({length:Math.min(7,pages)},(_,i)=>{
              let p=i+1;
              if(pages>7){if(page<=4)p=i+1;else if(page>=pages-3)p=pages-6+i;else p=page-3+i;}
              return <button key={p} onClick={()=>setPage(p)} className={`w-7 h-7 rounded-lg text-xs font-medium transition-colors ${p===page?'bg-[#4736FE] text-white':'hover:bg-gray-100 dark:hover:bg-white/[0.06] text-gray-500'}`}>{p}</button>;
            })}
            <button onClick={()=>setPage(p=>Math.min(pages,p+1))} disabled={page===pages}
              className="w-7 h-7 rounded-lg flex items-center justify-center disabled:opacity-30 hover:bg-gray-100 dark:hover:bg-white/[0.06] text-gray-500">
              <Ico n="chR" size={14}/>
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

// ── Invoicing Pending Tab ─────────────────────────────────────────────────

function InvoicingPending({ rows, fyFilter, fyOptions, onFYChange }) {
  const today = new Date(); today.setHours(0,0,0,0);
  const pending = useMemo(() => {
    let r = rows.filter(row => rowStatus(row) === 'po_issued');
    if (fyFilter.size > 0) r = r.filter(row => fyFilter.has(getFY(row['PR Date'])));
    return r.map(row => {
      const poD = parseDate(row['PO Date']);
      const daysSincePO = poD ? daysDiff(poD, today) : null;
      return { ...row, _daysSincePO: daysSincePO };
    }).sort((a,b) => (b._daysSincePO||0) - (a._daysSincePO||0));
  }, [rows, fyFilter]);

  const totalPOVal = pending.reduce((s,r)=>s+parseNum(r['PO with GST Value']),0);
  const oldest = pending.length ? pending[0]._daysSincePO : null;

  const [copied, setCopied] = useState(false);
  const slackText = `*🧾 Invoicing Pending* — ${today.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}\n${pending.length} POs pending invoicing | Total ${fmtMoney(totalPOVal,true)} | Oldest: ${oldest!=null?oldest+'d':'—'}`;

  function daysBadge(d) {
    if (d == null) return <span className="text-gray-400">—</span>;
    const cls = d < 30 ? 'bg-green-500/15 text-green-400' : d <= 60 ? 'bg-amber-500/15 text-amber-400' : 'bg-red-500/15 text-red-400';
    return <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${cls}`}>{d}d</span>;
  }

  return (
    <div className="fade-in">
      <div className="bg-white dark:bg-white/[0.03] border border-gray-100 dark:border-gray-800 rounded-2xl p-4 mb-4 flex flex-wrap items-center justify-between gap-3">
        <div>
          <div className="text-sm font-semibold mb-0.5">Invoicing Pending</div>
          <div className="text-xs text-gray-400">{pending.length} POs · Total PO value: <span className="font-semibold text-amber-400">{fmtMoney(totalPOVal,true)}</span> · Oldest: <span className="font-semibold text-red-400">{oldest!=null?oldest+'d':'—'}</span></div>
        </div>
        <div className="flex items-center gap-2">
          <MultiCheck label="FY" options={fyOptions} selected={fyFilter} onChange={onFYChange}/>
          <button onClick={()=>navigator.clipboard.writeText(slackText).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2000);})}
            className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-purple-500/10 text-purple-400 text-xs font-semibold hover:bg-purple-500/20 border border-purple-500/30 transition-colors">
            <Ico n={copied?'check':'slack'} size={12}/>{copied?'Copied!':'Slack'}
          </button>
        </div>
      </div>
      <div className="bg-white dark:bg-white/[0.03] border border-gray-100 dark:border-gray-800 rounded-2xl overflow-hidden">
        <div className="overflow-x-auto">
          <table className="w-full text-xs min-w-[900px]">
            <thead>
              <tr className="border-b border-gray-100 dark:border-gray-800 bg-gray-50 dark:bg-white/[0.02]">
                {['#','Location','Cost Center','EMSS POC','Vendor','PO Number','PO Date','PO Value (GST)','PR→PO Days','Days Since PO'].map(h=>(
                  <th key={h} className="text-left px-3 py-2.5 text-gray-400 font-semibold uppercase tracking-wider text-[10px]">{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {pending.map((r,i)=>(
                <tr key={i} className="border-b border-gray-50 dark:border-gray-800/60 hover:brightness-95 dark:hover:brightness-110 transition-all row-po_issued">
                  <td className="px-3 py-2.5 text-gray-400">{i+1}</td>
                  <td className="px-3 py-2.5 font-medium max-w-[160px] truncate" title={r['Location']}>{r['Location']||'—'}</td>
                  <td className="px-3 py-2.5 text-gray-500 font-mono text-[10px]">{r['Cost Center']||'—'}</td>
                  <td className="px-3 py-2.5 text-gray-500">{r['EMSS POC']||'—'}</td>
                  <td className="px-3 py-2.5 text-gray-500 max-w-[130px] truncate" title={r['Vendor Name']}>{r['Vendor Name']||'—'}</td>
                  <td className="px-3 py-2.5 font-mono text-[10px] text-[#4736FE]">{r['PO Number']||'—'}</td>
                  <td className="px-3 py-2.5 text-gray-400">{r['PO Date']||'—'}</td>
                  <td className="px-3 py-2.5 text-right font-medium">{fmtMoney(parseNum(r['PO with GST Value']),true)}</td>
                  <td className="px-3 py-2.5 text-gray-400 text-center">{r['Diff.days Between PR & PO']||'—'}</td>
                  <td className="px-3 py-2.5 text-center">{daysBadge(r._daysSincePO)}</td>
                </tr>
              ))}
              {pending.length === 0 && (
                <tr><td colSpan="10" className="px-4 py-8 text-center text-gray-400 text-sm">No POs pending invoicing ✓</td></tr>
              )}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// ── Dashboard ─────────────────────────────────────────────────────────────

function Dashboard({ data, approvalData, onApprovalDataChange, auth, onLogin, onLogout, onUploadDone, theme, onToggleTheme, toast }) {
  const urlCC = useMemo(()=>new URLSearchParams(window.location.search).get('costCenter')||'', []);
  const uploadRef = useRef();
  const approvalUploadRef = useRef();

  const [tab, setTab] = useState('table');
  const approvalRows = approvalData;
  const [search, setSearch] = useState('');
  const [fTypes, setFTypes]           = useState(new Set());
  const [fPOCs, setFPOCs]             = useState(new Set());
  const [fLocations, setFLocations]   = useState(new Set());
  const [fVendors, setFVendors]       = useState(new Set());
  const [fStatus, setFStatus]         = useState(new Set());
  const [fCostCenter, setFCostCenter] = useState(urlCC ? new Set([urlCC]) : new Set());
  const [fFY, setFFY]                 = useState(new Set());
  const [detailRow, setDetailRow]     = useState(null);
  const [uploading, setUploading]     = useState(false);

  const opts = useMemo(() => ({
    types:       uniq(data.map(r=>(r['CAPEX / OPEX / AMC']||'').split(/[\s,]+/)[0]).filter(Boolean)),
    pocs:        uniq(data.map(r=>r['EMSS POC'])),
    locations:   uniq(data.map(r=>r['Location'])),
    vendors:     uniq(data.map(r=>r['Vendor Name'])),
    statuses:    ['PR Issued','PO Issued','Invoiced','Cancelled'],
    costCenters: uniq(data.map(r=>r['Cost Center'])),
    fyOptions:   [...new Set(data.map(r=>getFY(r['PR Date'])).filter(Boolean))].sort().reverse(),
  }), [data]);

  const filtered = useMemo(() => {
    let rows = data;
    if (fCostCenter.size>0) rows=rows.filter(r=>fCostCenter.has(r['Cost Center']));
    if (fTypes.size>0) rows=rows.filter(r=>fTypes.has((r['CAPEX / OPEX / AMC']||'').split(/[\s,]+/)[0]));
    if (fPOCs.size>0) rows=rows.filter(r=>fPOCs.has(r['EMSS POC']));
    if (fLocations.size>0) rows=rows.filter(r=>fLocations.has(r['Location']));
    if (fVendors.size>0) rows=rows.filter(r=>fVendors.has(r['Vendor Name']));
    if (fStatus.size>0) {
      const m={'PR Issued':'pr_only','PO Issued':'po_issued','Invoiced':'invoiced','Cancelled':'cancelled'};
      rows=rows.filter(r=>[...fStatus].some(s=>rowStatus(r)===m[s]));
    }
    if (fFY.size>0) rows=rows.filter(r=>fFY.has(getFY(r['PR Date'])));
    if (search.trim()) { const q=search.trim().toLowerCase(); rows=rows.filter(r=>Object.values(r).some(v=>String(v).toLowerCase().includes(q))); }
    return rows;
  }, [data,fCostCenter,fTypes,fPOCs,fLocations,fVendors,fStatus,fFY,search]);

  const metrics = useMemo(() => {
    const active=filtered.filter(r=>rowStatus(r)!=='cancelled');
    const totalPR=active.reduce((s,r)=>s+parseNum(r['PR Basic Value']),0);
    const pendingPOs=active.filter(r=>rowStatus(r)==='pr_only').length;
    const invoicedVal=active.filter(r=>rowStatus(r)==='invoiced').reduce((s,r)=>s+parseNum(r['Bill Basic Value']),0);
    const tatVals=active.map(r=>parseFloat(r['Diff.days Between PR & PO'])).filter(v=>!isNaN(v)&&v>0&&v<365);
    const avgTAT=tatVals.length?Math.round(tatVals.reduce((a,b)=>a+b,0)/tatVals.length):0;
    return {totalPR,pendingPOs,invoicedVal,avgTAT,total:filtered.length};
  }, [filtered]);

  const pendingL1   = useMemo(()=>data.filter(r=>r['PR Number']&&!(r['L1 Approval']||'').trim()),[data]);
  const pendingBizFin = useMemo(()=>data.filter(r=>(r['L1 Approval']||'').trim()&&!(r['Bizfin']||'').trim()),[data]);

  const activeFilters = fCostCenter.size+fTypes.size+fPOCs.size+fLocations.size+fVendors.size+fStatus.size+fFY.size;

  function handleUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    if (!auth) { toast('Please log in first', 'err'); e.target.value=''; return; }
    setUploading(true);
    const reader = new FileReader();
    reader.onload = ev => {
      const csvText = ev.target.result;
      const rows = parseCSVText(csvText);
      if (!rows) { toast('Could not parse CSV — check format', 'err'); setUploading(false); return; }
      window.C24Uploader.upload({ csvText, workerUrl: WORKER_URL, toolPath: TOOL_PATH, auth })
        .then(() => { toast('✓ Data updated — live now', 'ok'); onUploadDone(rows); })
        .catch(er => {
          if (er.status===401) { toast('Session expired — log in again', 'err'); onLogout(); }
          else toast('Upload failed: '+(er.message||er), 'err');
        })
        .finally(() => { setUploading(false); e.target.value=''; });
    };
    reader.readAsText(file);
  }

  function handleApprovalUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    if (!auth) { toast('Please log in first to upload', 'err'); e.target.value=''; return; }
    const reader = new FileReader();
    reader.onload = ev => {
      const csvText = ev.target.result;
      const rows = parseProcessflowsCSV(csvText);
      if (!rows.length) { toast('Could not parse approval CSV — check format', 'err'); e.target.value=''; return; }
      onApprovalDataChange(rows);
      setTab('approval');
      window.C24Uploader.upload({ csvText, workerUrl: WORKER_URL, toolPath: APPROVAL_PATH, auth })
        .then(() => toast(`✓ ${rows.length} PRs saved to cloud`))
        .catch(er => {
          if (er.status===401) { toast('Session expired — log in again', 'err'); onLogout(); }
          else toast('Cloud save failed: '+(er.message||er), 'err');
        });
    };
    reader.readAsText(file);
    e.target.value = '';
  }

  function clearFilters() {
    setFCostCenter(new Set()); setFTypes(new Set()); setFPOCs(new Set());
    setFLocations(new Set()); setFVendors(new Set()); setFStatus(new Set()); setFFY(new Set()); setSearch('');
  }

  return (
    <div className="min-h-screen flex flex-col">
      <header className="flex items-center justify-between px-5 py-3.5 border-b border-gray-200 dark:border-gray-800 sticky top-0 z-20 bg-gray-50/90 dark:bg-[#111]/90 backdrop-blur-md">
        <div className="flex items-center gap-3">
          <a href="/" className="flex items-center gap-1.5 text-sm text-gray-400 hover:text-[#4736FE] transition-colors">
            <Ico n="back" size={14}/> C24 Hub
          </a>
          <div className="w-px h-5 bg-gray-200 dark:bg-gray-700"/>
          <a href="/budget/" className="hidden sm:flex text-sm text-gray-400 hover:text-[#4736FE] transition-colors font-medium">💰 Budget FY 26-27</a>
          <div className="hidden sm:block w-px h-5 bg-gray-200 dark:bg-gray-700"/>
          <div className="flex items-center gap-2">
            <span className="font-bold text-sm">PR / PO Tracker</span>
            {urlCC && <span className="text-xs px-2 py-0.5 rounded-full bg-[#4736FE]/10 text-[#4736FE] font-medium">{urlCC}</span>}
          </div>
        </div>
        <div className="flex items-center gap-2">
          <span className="text-xs text-gray-400 hidden sm:block">{data.length.toLocaleString()} records</span>
          {/* Upload CSVs */}
          <input ref={uploadRef} type="file" accept=".csv" className="hidden" onChange={handleUpload}/>
          <input ref={approvalUploadRef} type="file" accept=".csv" className="hidden" onChange={handleApprovalUpload}/>
          <button onClick={()=>{ if(auth) approvalUploadRef.current.click(); else onLogin(); }}
            className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold bg-amber-500/15 text-amber-500 border border-amber-500/30 hover:bg-amber-500/25 transition-colors">
            <Ico n="upload" size={12}/> Approval CSV
          </button>
          {auth ? (
            <>
              <button onClick={()=>uploadRef.current.click()} disabled={uploading}
                className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold bg-[#4736FE] text-white hover:bg-[#3829CC] disabled:opacity-50 transition-colors">
                {uploading ? <><Ico n="spin" size={12} cls="spin"/> Uploading…</> : <><Ico n="upload" size={12}/> Update CSV</>}
              </button>
              <button onClick={onLogout}
                className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium border border-gray-200 dark:border-gray-700 text-gray-500 hover:text-red-400 hover:border-red-400/50 transition-colors">
                <Ico n="logout" size={12}/> Logout
              </button>
            </>
          ) : (
            <button onClick={onLogin}
              className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium border border-gray-200 dark:border-gray-700 text-gray-500 hover:border-[#4736FE] hover:text-[#4736FE] transition-colors">
              <Ico n="lock" size={12}/> Login to upload
            </button>
          )}
          <button onClick={onToggleTheme} className="w-8 h-8 rounded-lg border border-gray-200 dark:border-gray-700 flex items-center justify-center text-gray-400 hover:text-[#4736FE] hover:border-[#4736FE] transition-colors">
            {theme==='dark'?<Ico n="sun" size={14}/>:<Ico n="moon" size={14}/>}
          </button>
        </div>
      </header>

      <main className="flex-1 px-4 sm:px-6 py-5 max-w-screen-2xl mx-auto w-full">
        <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-5">
          <MetricCard label="Total PR Value"  value={fmtMoney(metrics.totalPR,true)}     sub={`${metrics.total} requests`} color="indigo" icon={<Ico n="file"  size={18} cls="text-[#4736FE]"/>}/>
          <MetricCard label="Pending POs"     value={metrics.pendingPOs}                  sub="PRs awaiting PO"             color="blue"   icon={<Ico n="clock" size={18} cls="text-blue-400"/>}/>
          <MetricCard label="Total Invoiced"  value={fmtMoney(metrics.invoicedVal,true)} sub="Bills processed"             color="green"  icon={<Ico n="check" size={18} cls="text-green-400"/>}/>
          <MetricCard label="Avg PR→PO TAT"  value={metrics.avgTAT?`${metrics.avgTAT}d`:'—'} sub="Calendar days"           color="amber"  icon={<Ico n="alert" size={18} cls="text-amber-400"/>}/>
        </div>

        <div className="flex items-center gap-1 mb-5 flex-wrap">
          {[['table','📊 Dashboard'],['approval','⏱ Approval TAT'],['invoicing','🧾 Invoicing Pending']].map(([t,l])=>(
            <button key={t} onClick={()=>setTab(t)}
              className={`px-4 py-2 rounded-lg text-sm font-medium transition-colors ${tab===t?'bg-[#4736FE] text-white':'text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-white/[0.05]'}`}>
              {l}
            </button>
          ))}
        </div>

        {tab==='table' && (
          <div className="fade-in">
            <div className="flex flex-wrap items-center gap-2 mb-4">
              <div className="relative flex-1 min-w-[200px] max-w-xs">
                <Ico n="search" size={14} cls="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"/>
                <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search anything…"
                  className="w-full pl-9 pr-3 py-1.5 text-xs rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-white/[0.04] focus:outline-none focus:border-[#4736FE] transition-colors"/>
              </div>
              <MultiCheck label="Type"     options={opts.types}       selected={fTypes}      onChange={setFTypes}/>
              <MultiCheck label="POC"      options={opts.pocs}        selected={fPOCs}       onChange={setFPOCs}/>
              <MultiCheck label="Location" options={opts.locations}   selected={fLocations}  onChange={setFLocations}/>
              <MultiCheck label="Vendor"   options={opts.vendors}     selected={fVendors}    onChange={setFVendors}/>
              <MultiCheck label="Status"   options={opts.statuses}    selected={fStatus}     onChange={setFStatus}/>
              <MultiCheck label="Cost Ctr" options={opts.costCenters} selected={fCostCenter} onChange={setFCostCenter}/>
              <MultiCheck label="FY" options={opts.fyOptions} selected={fFY} onChange={setFFY}/>
              {activeFilters>0 && (
                <button onClick={clearFilters}
                  className="flex items-center gap-1 px-3 py-1.5 rounded-lg text-xs font-medium text-red-400 border border-red-400/30 hover:bg-red-500/10 transition-colors">
                  <Ico n="x" size={11}/> Clear ({activeFilters})
                </button>
              )}
            </div>
            <DataTable rows={filtered} onRowClick={setDetailRow}/>
          </div>
        )}

        {tab==='approval' && (
          <ApprovalTATTab approvalRows={approvalRows} approvalFileRef={approvalUploadRef}/>
        )}

        {tab==='invoicing' && (
          <InvoicingPending rows={data} fyFilter={fFY} fyOptions={opts.fyOptions} onFYChange={setFFY}/>
        )}
      </main>

      {detailRow && <DetailModal row={detailRow} onClose={()=>setDetailRow(null)}/>}
    </div>
  );
}

// ── Empty / Loading Screen ────────────────────────────────────────────────

function EmptyScreen({ loading, auth, onLogin, onLogout, theme, onToggleTheme, toast }) {
  const uploadRef = useRef();
  const [uploading, setUploading] = useState(false);
  const [onData, setOnData] = useState(null); // will be set by App

  // Emit data up via a callback the App wires in
  function handleUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    if (!auth) { toast('Please log in first', 'err'); e.target.value=''; return; }
    setUploading(true);
    const reader = new FileReader();
    reader.onload = ev => {
      const csvText = ev.target.result;
      const rows = parseCSVText(csvText);
      if (!rows) { toast('Could not parse CSV — check format', 'err'); setUploading(false); return; }
      window.C24Uploader.upload({ csvText, workerUrl: WORKER_URL, toolPath: TOOL_PATH, auth })
        .then(() => { toast('✓ Data uploaded — refreshing…', 'ok'); window.location.reload(); })
        .catch(er => { toast('Upload failed: '+(er.message||er), 'err'); })
        .finally(() => { setUploading(false); e.target.value=''; });
    };
    reader.readAsText(file);
  }

  return (
    <div className="min-h-screen flex flex-col">
      <header className="flex items-center justify-between px-4 sm:px-8 py-3.5 sm:py-5 border-b border-gray-200 dark:border-gray-800">
        <div className="flex items-center gap-4">
          <a href="/" className="flex items-center gap-2 text-sm text-gray-400 hover:text-[#4736FE] transition-colors"><Ico n="back" size={14}/> C24 Hub</a>
          <div className="w-px h-5 bg-gray-200 dark:bg-gray-700"/>
          <div><div className="font-bold text-sm">PR / PO Tracker</div><div className="text-xs text-gray-400 uppercase tracking-wider">C24 Expansion Hub</div></div>
        </div>
        <div className="flex items-center gap-2">
          {auth
            ? <button onClick={onLogout} className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs border border-gray-200 dark:border-gray-700 text-gray-400 hover:text-red-400 transition-colors"><Ico n="logout" size={12}/> Logout</button>
            : <button onClick={onLogin}  className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs border border-gray-200 dark:border-gray-700 text-gray-500 hover:border-[#4736FE] hover:text-[#4736FE] transition-colors"><Ico n="lock" size={12}/> Login</button>}
          <button onClick={onToggleTheme} className="w-8 h-8 rounded-lg border border-gray-200 dark:border-gray-700 flex items-center justify-center text-gray-400 hover:text-[#4736FE] transition-colors">
            {theme==='dark'?<Ico n="sun" size={14}/>:<Ico n="moon" size={14}/>}
          </button>
        </div>
      </header>
      <main className="flex-1 flex flex-col items-center justify-center px-4 py-16">
        {loading ? (
          <div className="flex flex-col items-center gap-4 text-gray-400">
            <Ico n="spin" size={32} cls="spin text-[#4736FE]"/>
            <p className="text-sm">Loading data from Cloudflare…</p>
          </div>
        ) : (
          <div className="text-center max-w-md">
            <div className="w-16 h-16 rounded-2xl bg-[#4736FE]/10 border border-[#4736FE]/30 flex items-center justify-center mx-auto mb-5">
              <Ico n="file" size={28} cls="text-[#4736FE]"/>
            </div>
            <h1 className="text-xl font-bold mb-2">No data yet</h1>
            <p className="text-gray-400 text-sm mb-6">The PR/PO tracker has no CSV on Cloudflare yet. Log in and upload the first export to go live.</p>
            {auth ? (
              <>
                <input ref={uploadRef} type="file" accept=".csv" className="hidden" onChange={handleUpload}/>
                <button onClick={()=>uploadRef.current.click()} disabled={uploading}
                  className="flex items-center gap-2 px-5 py-2.5 rounded-xl bg-[#4736FE] text-white text-sm font-semibold hover:bg-[#3829CC] disabled:opacity-50 transition-colors mx-auto">
                  {uploading ? <><Ico n="spin" size={14} cls="spin"/> Uploading…</> : <><Ico n="upload" size={14}/> Upload CSV to Cloudflare</>}
                </button>
              </>
            ) : (
              <button onClick={onLogin} className="flex items-center gap-2 px-5 py-2.5 rounded-xl border border-[#4736FE] text-[#4736FE] text-sm font-semibold hover:bg-[#4736FE]/10 transition-colors mx-auto">
                <Ico n="lock" size={14}/> Login to upload
              </button>
            )}
          </div>
        )}
      </main>
    </div>
  );
}

// ── Root App ──────────────────────────────────────────────────────────────

function App() {
  const [data, setData]               = useState(null);
  const [approvalData, setApprovalData] = useState([]);
  const [loading, setLoading]         = useState(true);
  const [auth, setAuth]               = useState(null);
  const [loginOpen, setLoginOpen]     = useState(false);
  const [theme, setTheme]             = useState(()=>{ try{return localStorage.getItem('c24-theme')||'light';}catch{return'light';} });
  const { toasts, add: toast }        = useToast();

  // Fetch main CSV + approval CSV from Cloudflare on mount
  useEffect(() => {
    if (location.protocol === 'file:') { setLoading(false); return; }
    window.C24Uploader.fetchText(WORKER_URL + TOOL_PATH + '.csv', { cache: 'no-store' })
      .then(text => {
        const rows = parseCSVText(text);
        if (rows) setData(rows);
        else toast('No valid data in stored CSV', 'err');
      })
      .catch(() => {})
      .finally(() => setLoading(false));
    // Load approval CSV independently — silent if not yet uploaded
    window.C24Uploader.fetchText(WORKER_URL + APPROVAL_PATH + '.csv', { cache: 'no-store' })
      .then(text => {
        const rows = parseProcessflowsCSV(text);
        if (rows.length) setApprovalData(rows);
      })
      .catch(() => {});
  }, []);

  function toggleTheme() {
    const next = theme==='dark'?'light':'dark';
    setTheme(next);
    try{localStorage.setItem('c24-theme',next);}catch{}
    if(next==='dark') document.documentElement.classList.add('dark');
    else document.documentElement.classList.remove('dark');
  }

  function handleLogin(creds) { setAuth(creds); setLoginOpen(false); toast('✓ Logged in', 'ok'); }
  function handleLogout() { setAuth(null); toast('Logged out', 'ok'); }

  return (
    <>
      {data
        ? <Dashboard data={data} approvalData={approvalData} onApprovalDataChange={setApprovalData}
            auth={auth} onLogin={()=>setLoginOpen(true)} onLogout={handleLogout}
            onUploadDone={setData} theme={theme} onToggleTheme={toggleTheme} toast={toast}/>
        : <EmptyScreen loading={loading} auth={auth} onLogin={()=>setLoginOpen(true)} onLogout={handleLogout}
            theme={theme} onToggleTheme={toggleTheme} toast={toast}/>
      }
      {loginOpen && <LoginModal onSuccess={handleLogin} onClose={()=>setLoginOpen(false)} toast={toast}/>}
      <ToastLayer toasts={toasts}/>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
