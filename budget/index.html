// ── Helpers ───────────────────────────────────────────────────────────────

function fmtMoney(v, short=false) {
  if (!v || v === 0) return '—';
  if (short) {
    if (v >= 10000000) return `₹${(v/10000000).toFixed(2)}Cr`;
    if (v >= 100000) return `₹${(v/100000).toFixed(2)}L`;
    if (v >= 1000) return `₹${(v/1000).toFixed(1)}K`;
  }
  return '₹' + Math.round(v).toLocaleString('en-IN');
}

function fmtL(v) {
  if (!v) return '—';
  return `₹${(v/100000).toFixed(2)}L`;
}

function uniqSorted(arr) { return [...new Set(arr.filter(Boolean))].sort(); }

function getAssumptions(col, row) {
  const cat = row.category || '';
  const park = row.parking || '';
  if (col === 'infraCost') {
    const key = cat.includes('NSO') ? 'NSO' : cat.includes('Major') ? 'Major Upgrade' : cat.includes('Minor') ? 'Minor Upgrade' : cat.includes('Basic') ? 'Basic Upgrade' : cat.includes('Replacement') ? 'Replacement' : cat === 'HRC' ? 'HRC' : null;
    return key ? (ASSUMPTIONS.infraCost[key] || []) : [];
  }
  if (col === 'itCost') {
    const key = cat.includes('NSO') ? (park==='Open'?'NSO-Open':'NSO-Covered') : cat==='HRC'?'HRC' : park==='Open'?'Open':'Covered';
    return ASSUMPTIONS.itCost[key] || [];
  }
  if (col === 'vm') {
    return cat.includes('NSO') ? ASSUMPTIONS.vm['NSO'] : ASSUMPTIONS.vm['default'];
  }
  if (col === 'slotMarking') {
    const key = cat.includes('NSO') ? 'NSO' : park==='Open' ? 'Upgrade-Open' : 'Upgrade-Covered';
    return ASSUMPTIONS.slotMarking[key] || [];
  }
  if (col === 'totalMaint') {
    const key = cat.includes('NSO') ? (park==='Open'?'NSO-Open':'NSO-Covered') : park==='Open'?'Open':'Covered';
    return ASSUMPTIONS.totalMaint[key] || [];
  }
  if (col === 'hrcTotal') {
    const key = cat==='Existing HRC' ? 'Existing HRC' : cat==='HRC' ? 'HRC' : 'New HRC';
    return ASSUMPTIONS.hrcTotal[key] || [];
  }
  return [];
}

// ── MultiCheck ────────────────────────────────────────────────────────────

function MultiCheck({ label, options, selected, onChange }) {
  const [open, setOpen] = useState(false);
  const ref = useRef();
  useEffect(() => {
    function h(e) { if (ref.current && !ref.current.contains(e.target)) setOpen(false); }
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, []);
  const count = selected.size;
  return (
    <div className="relative" ref={ref}>
      <button onClick={()=>setOpen(o=>!o)}
        className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium border transition-colors
          ${count>0 ? 'border-[#4736FE] bg-[#4736FE]/10 text-[#4736FE]' : 'border-gray-200 dark:border-gray-700 text-gray-500 dark:text-gray-400 hover:border-gray-300'}`}>
        <Ico n="filter" size={11}/>{label}{count>0&&` (${count})`}
      </button>
      {open && (
        <div className="absolute top-full mt-1 left-0 z-30 min-w-[180px] bg-white dark:bg-[#1a1a1a] border border-gray-200 dark:border-gray-700 rounded-xl shadow-xl p-2 max-h-64 overflow-y-auto fade-in">
          <div className="flex items-center justify-between px-1 pb-1 mb-1 border-b border-gray-100 dark:border-gray-800">
            <span className="text-[10px] font-semibold text-gray-400 uppercase tracking-wider">{label}</span>
            {count>0 && <button onClick={()=>onChange(new Set())} className="text-[10px] text-[#4736FE] hover:underline">Clear</button>}
          </div>
          {options.map(o => (
            <label key={o} className="flex items-center gap-2 px-2 py-1.5 rounded-lg hover:bg-gray-50 dark:hover:bg-white/[0.04] cursor-pointer">
              <input type="checkbox" checked={selected.has(o)}
                onChange={e=>{const s=new Set(selected);e.target.checked?s.add(o):s.delete(o);onChange(s);}}
                className="accent-[#4736FE] w-3.5 h-3.5"/>
              <span className="text-xs text-gray-600 dark:text-gray-300">{o}</span>
            </label>
          ))}
        </div>
      )}
    </div>
  );
}

          <Ico n="search" size={14} cls="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"/>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search hub, city…"
            className="w-full pl-9 pr-3 py-1.5 text-xs rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-white/[0.04] focus:outline-none focus:border-[#4736FE] transition-colors"/>
        </div>
        <MultiCheck label="Zone" options={opts.zones} selected={fZone} onChange={setFZone}/>
        <MultiCheck label="City" options={opts.cities} selected={fCity} onChange={setFCity}/>
        <MultiCheck label="Category" options={opts.cats} selected={fCat} onChange={setFCat}/>
        <MultiCheck label="Stage" options={opts.stages} selected={fStage} onChange={setFStage}/>
        {(activeFilters>0||search) && (
          <button onClick={()=>{setFZone(new Set());setFCity(new Set());setFCat(new Set());setFStage(new Set());setSearch('');}}
            className="flex items-center gap-1 px-3 py-1.5 rounded-lg text-xs font-medium text-red-400 border border-red-400/30 hover:bg-red-500/10 transition-colors">
            <Ico n="x" size={11}/> Clear
          </button>
        )}
        <span className="ml-auto text-xs text-gray-400">{filtered.length} hubs</span>
      </div>
      <div className="bg-white dark:bg-white/[0.03] border border-gray-100 dark:border-gray-800 rounded-2xl overflow-hidden">
        <div className="overflow-x-auto">
          <table className="w-full text-xs min-w-[1100px]">
            <thead>
              <tr className="border-b border-gray-100 dark:border-gray-800 bg-gray-50 dark:bg-white/[0.02]">
                {['Cost Center','Hub','City','Zone','Category','Stage','Parking','Slots','Total Capex','Infra Cost','Slot Marking','VM','New Init.','IT Cost','HRC Total','Maintenance','Grand Total'].map(h=>(
                  <th key={h} className="text-left px-3 py-2.5 text-gray-400 font-semibold uppercase tracking-wider text-[10px]">{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {filtered.map((r,i) => (
                <React.Fragment key={i}>
                  <tr className="border-b border-gray-50 dark:border-gray-800/60 cursor-pointer hover:brightness-95 dark:hover:brightness-110 transition-all"
                    onClick={()=>setExpanded(expanded===i?null:i)}>
                    <td className="px-3 py-2.5 font-mono text-[10px] text-gray-400 max-w-[140px] truncate" title={r.costCenter}>
                      {r.costCenter ? (
                        <a href={`/pr-po-tracker/?costCenter=${encodeURIComponent(r.costCenter)}`}
                          className="text-[#4736FE] hover:underline" onClick={e=>e.stopPropagation()}>
                          {r.costCenter}
                        </a>
                      ) : '—'}
                    </td>
                    <td className="px-3 py-2.5 font-medium max-w-[200px] truncate" title={r.hub}>{r.hub}</td>
                    <td className="px-3 py-2.5 text-gray-500">{r.city}</td>
                    <td className="px-3 py-2.5 text-gray-500">{r.zone}</td>
                    <td className="px-3 py-2.5">
                      <span className="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-gray-100 dark:bg-white/[0.06] text-gray-500">{r.category}</span>
                    </td>
                    <td className="px-3 py-2.5">
                      <span className={`px-2 py-0.5 rounded-full text-[10px] font-semibold ${stageCls[r.stage]||'bg-gray-100 text-gray-400'}`}>{r.stage}</span>
                    </td>
                    <td className="px-3 py-2.5 text-gray-500">{r.parking}</td>
                    <td className="px-3 py-2.5 text-right text-gray-500">{r.slots||'—'}</td>
                    <td className="px-3 py-2.5 text-right font-semibold text-[#4736FE]">{fmtL(r.totalCapex)}</td>
                    <MoneyCell value={r.infraCost} col="infraCost" row={r}/>
                    <MoneyCell value={r.slotMarking} col="slotMarking" row={r}/>
                    <MoneyCell value={r.vm} col="vm" row={r}/>
                    <td className="px-3 py-2.5 text-right text-xs">{r.newInitiatives ? fmtL(r.newInitiatives) : '—'}</td>
                    <MoneyCell value={r.itCost} col="itCost" row={r}/>
                    <MoneyCell value={r.hrcTotal} col="hrcTotal" row={r}/>
                    <MoneyCell value={r.totalMaint} col="totalMaint" row={r}/>
                    <td className="px-3 py-2.5 text-right font-bold">{fmtL(r.grandTotal)}</td>
                  </tr>
                  {expanded===i && (
                    <tr>
                      <td colSpan="17" className="px-5 py-4 bg-[#4736FE]/5 border-b border-gray-100 dark:border-gray-800">
                        <div className="grid grid-cols-3 sm:grid-cols-6 gap-3">
                          {[['Infra Cost',r.infraCost],['Slot Marking',r.slotMarking],['VM',r.vm],['New Initiatives',r.newInitiatives],['IT Cost',r.itCost],['HRC Total',r.hrcTotal],['Maintenance',r.totalMaint],['Grand Total',r.grandTotal]].map(([l,v])=>(
                            <div key={l} className="bg-white dark:bg-black/20 rounded-xl p-3">
                              <div className="text-[10px] text-gray-400 mb-1">{l}</div>
                              <div className="text-sm font-bold">{fmtL(v)}</div>
                            </div>
                          ))}
                        </div>
                      </td>
                    </tr>
                  )}
                </React.Fragment>
              ))}
            </tbody>
            <tfoot>
              <tr className="border-t-2 border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-white/[0.03] font-bold">
                <td colSpan="8" className="px-3 py-3 text-xs text-gray-500">TOTAL ({filtered.length} hubs)</td>
                <td className="px-3 py-3 text-right text-xs text-[#4736FE]">{fmtL(totals.totalCapex)}</td>
                <td className="px-3 py-3 text-right text-xs">{fmtL(totals.infraCost)}</td>
                <td className="px-3 py-3 text-right text-xs">{fmtL(totals.slotMarking)}</td>
                <td className="px-3 py-3 text-right text-xs">{fmtL(totals.vm)}</td>
                <td className="px-3 py-3 text-right text-xs">—</td>
                <td className="px-3 py-3 text-right text-xs">{fmtL(totals.itCost)}</td>
                <td className="px-3 py-3 text-right text-xs">{fmtL(totals.hrcTotal)}</td>
                <td className="px-3 py-3 text-right text-xs">{fmtL(totals.totalMaint)}</td>
                <td className="px-3 py-3 text-right text-xs">{fmtL(totals.grandTotal)}</td>
              </tr>
            </tfoot>
          </table>
        </div>
      </div>
    </div>
  );
}

// ── C2B Tab ───────────────────────────────────────────────────────────────

function C2BTab() {
  const byZone = useMemo(() => {
    const m = {};
    C2B_DATA.forEach(r => { if (!m[r.zone]) m[r.zone]=[]; m[r.zone].push(r); });
    return Object.entries(m);
  }, []);
  const total = C2B_DATA.reduce((s,r)=>s+r.totalCapex,0);

  return (
    <div className="fade-in space-y-4">
      <div className="flex items-center gap-4 bg-[#4736FE]/10 border border-[#4736FE]/30 rounded-2xl px-5 py-4">
        <div>
          <div className="text-xs text-gray-400 mb-1">C2B Parking Hubs Total</div>
          <div className="text-2xl font-bold text-[#4736FE]">{fmtL(total)}</div>
        </div>
        <div className="ml-6 text-xs text-gray-400">
          {C2B_DATA.length} hubs × ₹3L each | Infra/Networking: ₹2L + Rack: ₹1L per hub
        </div>
      </div>
      {byZone.map(([zone, rows]) => (
        <div key={zone} className="bg-white dark:bg-white/[0.03] border border-gray-100 dark:border-gray-800 rounded-2xl overflow-hidden">
          <div className="px-5 py-3 border-b border-gray-100 dark:border-gray-800 flex items-center justify-between">
            <span className="font-semibold text-sm">{zone} Zone</span>
            <span className="text-xs text-gray-400">{rows.length} hubs · {fmtL(rows.reduce((s,r)=>s+r.totalCapex,0))}</span>
          </div>
          <div className="overflow-x-auto">
            <table className="w-full text-xs">
              <thead>
                <tr className="border-b border-gray-50 dark:border-gray-800/60 bg-gray-50 dark:bg-white/[0.02]">
                  {['#','Hub Name','Infra/Networking','Rack','Total Capex'].map(h=>(
                    <th key={h} className="text-left px-4 py-2 text-gray-400 font-semibold uppercase tracking-wider text-[10px]">{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {rows.map((r,i) => (
                  <tr key={i} className="border-b border-gray-50 dark:border-gray-800/60">
                    <td className="px-4 py-2.5 text-gray-400">{i+1}</td>
                    <td className="px-4 py-2.5 font-medium">{r.hub}</td>
                    <td className="px-4 py-2.5 text-right">{fmtL(r.infraNetworking)}</td>
                    <td className="px-4 py-2.5 text-right">{fmtL(r.rack)}</td>
                    <td className="px-4 py-2.5 text-right font-bold text-[#4736FE]">{fmtL(r.totalCapex)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      ))}
    </div>
  );
}

// ── NSO Pipeline Tab ──────────────────────────────────────────────────────

function NSOTab() {
  const rows = useMemo(() => {
    return GS_HUB_DATA
      .filter(r => ['NSO','Replacement'].includes(r.category) || ['YTD','YTL'].includes(r.stage))
      .sort((a,b) => {
        const ord = {YTL:0, YTD:1, Active:2};
        return (ord[a.stage]??3) - (ord[b.stage]??3);
      });
  }, []);

  const total = rows.reduce((s,r)=>s+r.grandTotal,0);
  const capex = rows.reduce((s,r)=>s+r.totalCapex,0);

  const stageCls = {Active:'bg-green-500/15 text-green-400', YTD:'bg-amber-500/15 text-amber-400', YTL:'bg-blue-500/15 text-blue-400'};

  return (
    <div className="fade-in space-y-4">
      <div className="flex flex-wrap gap-4">
        <div className="bg-white dark:bg-white/[0.03] border border-gray-100 dark:border-gray-800 rounded-2xl px-5 py-4">
          <div className="text-xs text-gray-400 mb-1">Sites in Pipeline</div>
          <div className="text-2xl font-bold">{rows.length}</div>
        </div>
        <div className="bg-white dark:bg-white/[0.03] border border-gray-100 dark:border-gray-800 rounded-2xl px-5 py-4">
          <div className="text-xs text-gray-400 mb-1">Total Capex Budget</div>
          <div className="text-2xl font-bold text-[#4736FE]">{fmtL(capex)}</div>
        </div>
        <div className="bg-white dark:bg-white/[0.03] border border-gray-100 dark:border-gray-800 rounded-2xl px-5 py-4">
          <div className="text-xs text-gray-400 mb-1">Grand Total (incl. Maint)</div>
          <div className="text-2xl font-bold text-amber-400">{fmtL(total)}</div>
        </div>
      </div>
      <div className="bg-white dark:bg-white/[0.03] border border-gray-100 dark:border-gray-800 rounded-2xl overflow-hidden">
        <div className="overflow-x-auto">
          <table className="w-full text-xs min-w-[700px]">
            <thead>
              <tr className="border-b border-gray-100 dark:border-gray-800 bg-gray-50 dark:bg-white/[0.02]">
                {['#','Hub','City','Zone','Stage','Category','Total Capex','Grand Total'].map(h=>(
                  <th key={h} className="text-left px-4 py-2.5 text-gray-400 font-semibold uppercase tracking-wider text-[10px]">{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {rows.map((r,i) => (
                <tr key={i} className="border-b border-gray-50 dark:border-gray-800/60">
                  <td className="px-4 py-2.5 text-gray-400">{i+1}</td>
                  <td className="px-4 py-2.5 font-medium max-w-[200px] truncate" title={r.hub}>{r.hub}</td>
                  <td className="px-4 py-2.5 text-gray-500">{r.city}</td>
                  <td className="px-4 py-2.5 text-gray-500">{r.zone}</td>
                  <td className="px-4 py-2.5"><span className={`px-2 py-0.5 rounded-full text-[10px] font-semibold ${stageCls[r.stage]||''}`}>{r.stage}</span></td>
                  <td className="px-4 py-2.5"><span className="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-[#4736FE]/15 text-[#4736FE]">{r.category}</span></td>
                  <td className="px-4 py-2.5 text-right font-semibold text-[#4736FE]">{fmtL(r.totalCapex)}</td>
                  <td className="px-4 py-2.5 text-right font-bold">{fmtL(r.grandTotal)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// ── Assumptions Tab ───────────────────────────────────────────────────────

function AssumptionsTab() {
  const infra = ASSUMPTIONS.infraCost;
  const packages = [
    {label:'NSO', items:infra['NSO'], note:'New Store Opening — full fit-out'},
    {label:'Major Upgrade', items:infra['Major Upgrade'], note:'Significant civil + ops upgrade'},
    {label:'Minor Upgrade', items:infra['Minor Upgrade'], note:'Cosmetic + maintenance upgrade'},
    {label:'Basic Upgrade', items:infra['Basic Upgrade'], note:'Painting, minor repairs'},
    {label:'Replacement', items:infra['Replacement'], note:'Full hub rebuild at new location'},
    {label:'HRC (new setup)', items:infra['HRC'], note:'Hub Reconditioning Centre — new'},
  ];

  const standards = [
    {label:'IT Cost — Covered Hub', value:'₹1.5L'},
    {label:'IT Cost — Open Hub', value:'₹2L'},
    {label:'IT Cost — NSO Open', value:'₹3L (Setup ₹2.5L + Router ₹0.5L)'},
    {label:'IT Cost — NSO Covered', value:'₹2.5L (Setup ₹2L + Router ₹0.5L)'},
    {label:'Maintenance — Covered Hub/yr', value:'₹6L (Infra ₹3L + VM ₹3L)'},
    {label:'Maintenance — Open Hub/yr', value:'₹7.5L (Infra ₹4L + VM ₹3.5L)'},
    {label:'Slot Marking — NSO', value:'₹0.3L'},
    {label:'Slot Marking — Covered (Upgrade)', value:'₹0.9L'},
    {label:'Slot Marking — Open (Upgrade)', value:'₹2L'},
    {label:'HRC — New Setup Total', value:'₹45.5L (full setup)'},
    {label:'HRC — Existing Maintenance/yr', value:'₹10.5L per HRC'},
    {label:'C2B Parking Hub', value:'₹3L (Infra/Networking ₹2L + Rack ₹1L)'},
  ];

  return (
    <div className="fade-in space-y-5">
      <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        {packages.map(p => (
          <div key={p.label} className="bg-white dark:bg-white/[0.03] border border-gray-100 dark:border-gray-800 rounded-2xl p-5">
            <div className="font-semibold text-sm mb-1">{p.label}</div>
            <div className="text-xs text-gray-400 mb-3">{p.note}</div>
            <div className="space-y-2">
              {p.items.map((it,i) => (
                <div key={i} className="flex justify-between gap-2 text-xs border-b border-gray-50 dark:border-gray-800/50 pb-1.5">
                  <span className="text-gray-600 dark:text-gray-300">{it.label}</span>
                  <span className="font-semibold text-right">{it.amount!=null ? fmtL(it.amount) : '—'}</span>
                </div>
              ))}
              <div className="flex justify-between gap-2 text-xs pt-1">
                <span className="font-bold">Total</span>
                <span className="font-bold text-[#4736FE]">{fmtL(p.items.filter(it=>it.amount!=null).reduce((s,it)=>s+(it.amount||0),0))}</span>
              </div>
            </div>
          </div>
        ))}
      </div>
      <div className="bg-white dark:bg-white/[0.03] border border-gray-100 dark:border-gray-800 rounded-2xl p-5">
        <div className="font-semibold text-sm mb-4">Standard Package Costs</div>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
          {standards.map((s,i) => (
            <div key={i} className="flex justify-between gap-3 text-xs py-2 border-b border-gray-50 dark:border-gray-800/50">
              <span className="text-gray-500">{s.label}</span>
              <span className="font-semibold">{s.value}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────────────────

function App() {
  const [tab, setTab] = useState('summary');
  const [theme, setTheme] = useState(()=>{ try{return localStorage.getItem('c24-theme')||'dark';}catch{return'dark';} });

  function toggleTheme() {
    const next = theme==='dark'?'light':'dark';
    setTheme(next);
    try{localStorage.setItem('c24-theme',next);}catch{}
    if(next==='dark') document.documentElement.classList.add('dark');
    else document.documentElement.classList.remove('dark');
  }

  // Pre-filter from URL if ?costCenter=XX (redirects to GS tab)
  useEffect(() => {
    const cc = new URLSearchParams(window.location.search).get('costCenter');
    if (cc) setTab('hubs');
  }, []);

  const tabs = [
    ['summary','📊 Summary'],
    ['hubs','🏢 GS Hubs'],
    ['c2b','🚗 C2B'],
    ['nso','🏗 NSO Pipeline'],
    ['assumptions','📐 Assumptions'],
  ];

  return (
    <div className="min-h-screen flex flex-col">
      <header className="flex items-center justify-between px-5 py-3.5 border-b border-gray-200 dark:border-gray-800 sticky top-0 z-20 bg-gray-50/90 dark:bg-[#111]/90 backdrop-blur-md">
        <div className="flex items-center gap-3">
          <a href="/" className="flex items-center gap-1.5 text-sm text-gray-400 hover:text-[#4736FE] transition-colors">
            <Ico n="back" size={14}/> Hub
          </a>
          <div className="w-px h-5 bg-gray-200 dark:bg-gray-700"/>
          <a href="/pr-po-tracker/" className="text-sm text-gray-400 hover:text-[#4736FE] transition-colors font-medium">📋 PR/PO Tracker</a>
          <div className="w-px h-5 bg-gray-200 dark:bg-gray-700"/>
          <span className="font-bold text-sm">Capex Budget FY 26-27</span>
        </div>
        <button onClick={toggleTheme} className="w-8 h-8 rounded-lg border border-gray-200 dark:border-gray-700 flex items-center justify-center text-gray-400 hover:text-[#4736FE] hover:border-[#4736FE] transition-colors">
          {theme==='dark'?<Ico n="sun" size={14}/>:<Ico n="moon" size={14}/>}
        </button>
      </header>

      <main className="flex-1 px-4 sm:px-6 py-5 max-w-screen-2xl mx-auto w-full">
        <div className="flex items-center gap-1 mb-5 flex-wrap">
          {tabs.map(([t,l]) => (
            <button key={t} onClick={()=>setTab(t)}
              className={`px-4 py-2 rounded-lg text-sm font-medium transition-colors ${tab===t?'bg-[#4736FE] text-white':'text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-white/[0.05]'}`}>
              {l}
            </button>
          ))}
        </div>

        {tab==='summary' && <SummaryTab/>}
        {tab==='hubs' && <GSHubsTab/>}
        {tab==='c2b' && <C2BTab/>}
        {tab==='nso' && <NSOTab/>}
        {tab==='assumptions' && <AssumptionsTab/>}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
