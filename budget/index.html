function getAssumptions(col, row) {
  const cat = row.category || '';
  const park = row.parking || '';

  // Hub-specific override
  const hubKey = Object.keys(HUB_ASSUMPTIONS).find(k => (row.hub||'').includes(k));
  if (hubKey && HUB_ASSUMPTIONS[hubKey][col]) return HUB_ASSUMPTIONS[hubKey][col];
  const isNSO = cat==='NSO'||cat==='Replacement';
  const isOpen = park==='Open';

  if (col === 'infraCost') {
    const k = cat.includes('NSO')?'NSO':cat.includes('Major')?'Major Upgrade':cat.includes('Minor')?'Minor Upgrade':cat.includes('Basic')?'Basic Upgrade':cat.includes('Replacement')?'Replacement':cat==='HRC'?'HRC':null;
    return k ? (ASSUMPTIONS.infraCost[k]||[]) : [];
  }
  if (col === 'slotMarking') {
    const k = cat.includes('NSO')||cat.includes('Replacement') ? 'NSO' : isOpen ? 'Open' : 'Covered';
    return ASSUMPTIONS.slotMarking[k]||[];
  }
  if (col === 'vm') {
    if (cat.includes('NSO')) return ASSUMPTIONS.vm[isOpen?'NSO-Open':'NSO-Covered'];
    return ASSUMPTIONS.vm[isOpen?'Open':'Covered'];
  }
  if (col === 'newInitiatives') {
    if (cat.includes('NSO')) return ASSUMPTIONS.newInitiatives[isOpen?'NSO-Open':'NSO-Covered']||[];
    if (cat.includes('Replacement')) return ASSUMPTIONS.newInitiatives['Replacement']||[];
    if (cat.includes('Major')) return ASSUMPTIONS.newInitiatives[isOpen?'Major-Open':'Major-Covered']||[];
    if (cat.includes('Minor')) return ASSUMPTIONS.newInitiatives[isOpen?'Minor-Open':'Minor-Covered']||[];
    return ASSUMPTIONS.newInitiatives[isOpen?'Basic-Open':'Basic-Covered']||[];
  }
  if (col === 'itCost') {
    if (cat.includes('NSO')) return ASSUMPTIONS.itCost[isOpen?'NSO-Open':'NSO-Covered']||[];
    if (cat==='HRC') return ASSUMPTIONS.itCost['HRC']||[];
    if (cat.includes('Replacement')) return ASSUMPTIONS.itCost[isOpen?'Replacement-Open':'Replacement-Covered']||[];
    return ASSUMPTIONS.itCost[isOpen?'Open':'Covered']||[];
  }
  if (col === 'hrcTotal') {
    const k = cat==='Existing HRC'?'Existing HRC':cat==='HRC'?'HRC':'default';
    return ASSUMPTIONS.hrcTotal[k]||[];
  }
  if (col === 'hrcCapex') {
    if (cat==='HRC') return [{label:'Studio Setup',amount:1200000},{label:'Shed and PCC',amount:800000},{label:'Paint Booth',amount:400000},{label:'Washroom',amount:300000},{label:'Lift (4 nos)',amount:650000},{label:'Compressor',amount:250000},{label:'New Paint Booth',amount:1000000},{label:'Misc',amount:150000}];
    if (cat==='Existing HRC') return [{label:'Capital works at existing HRC — site-specific',amount:null}];
    return [];
  }
  if (col === 'hrcItCost') return (cat==='HRC'||cat==='Existing HRC') ? [{label:'IT Work — HRC setup',amount:200000}] : [];
  if (col === 'hrcMaint') return cat==='Existing HRC' ? [{label:'HRC Annual Maintenance',amount:150000}] : [];
  if (col === 'infraMaint') {
    const amt = isOpen ? 400000 : 300000;
    return [{label:`Infra Maintenance (${isOpen?'Open':'Covered'} Hub)`,amount:amt}];
  }
  if (col === 'vmMaint') {
    const amt = isOpen ? 350000 : 300000;
    return [{label:`VM Maintenance (${isOpen?'Open':'Covered'} Hub)`,amount:amt}];
  }
  if (col === 'totalMaint') {
    if (cat.includes('NSO')||cat.includes('Replacement')) return ASSUMPTIONS.totalMaint[isOpen?'NSO-Open':'NSO-Covered']||[];
    return ASSUMPTIONS.totalMaint[isOpen?'Open':'Covered']||[];
  }
  return [];
}

// ── Formatters ─────────────────────────────────────────────────────────────

function fmtAmt(v) {
  if (!v || v === 0) return '—';
  const a = Math.abs(v);
  if (a >= 10000000) return `₹${(v/10000000).toFixed(2)} Cr`;
  if (a >= 100000)   return `₹${(v/100000).toFixed(2)} L`;
  if (a >= 1000)     return `₹${(v/1000).toFixed(1)} K`;
  return `₹${Math.round(v)}`;
}
function uniq(arr) { return [...new Set(arr.filter(Boolean))].sort(); }

// ── Excel Parser ──────────────────────────────────────────────────────────

function parseExcel(buffer) {
  const wb = XLSX.read(buffer, {type:'array'});
  const gsSheet = wb.Sheets['GS Capex AOP'];
  const c2bSheet = wb.Sheets['C2B Capex AOP'];
  const gsRows = [], c2bRows = [];

  if (gsSheet) {
    const raw = XLSX.utils.sheet_to_json(gsSheet, {header:1, defval:null});
    // Find header row (has 'Hub Name')
    let hi = raw.findIndex(r => r && r.some(c => String(c||'').includes('Hub Name')));
    if (hi < 0) hi = 2;
    for (let i = hi+1; i < raw.length; i++) {
      const r = raw[i];
      if (!r || !r[2]) continue;
      const stage = String(r[4]||'').trim();
      if (!['Active','YTD','YTL'].includes(stage)) continue;
      gsRows.push({
        costCenter: String(r[0]||'').trim(),
        hub: String(r[2]||'').trim(),
        city: String(r[3]||'').trim() || String(r[2]||'').split(',').pop().trim(),
        stage, zone: String(r[5]||'').trim(),
        category: String(r[6]||'').trim(),
        parking: String(r[7]||'').trim(),
        slots: Number(r[8])||0,
        grossRental: Number(r[9])||0,
        totalCapex: Number(r[10])||0,
        infraCost: Number(r[11])||0,
        slotMarking: Number(r[12])||0,
        vm: Number(r[13])||0,
        newInitiatives: Number(r[14])||0,
        itCost: Number(r[15])||0,
        hrcTotal: Number(r[16])||0,
        hrcCapex: Number(r[17])||0,
        hrcItCost: Number(r[18])||0,
        hrcMaint: Number(r[19])||0,
        totalMaint: Number(r[20])||0,
        infraMaint: Number(r[21])||0,
        vmMaint: Number(r[22])||0,
        grandTotal: Number(r[23])||0,
      });
    }
  }

  if (c2bSheet) {
    const raw = XLSX.utils.sheet_to_json(c2bSheet, {header:1, defval:null});
    let c2bHi = raw.findIndex(r => r && r.some(c => String(c||'').includes('Hub Name')));
    if (c2bHi < 0) c2bHi = 2;
    for (let i = c2bHi+1; i < raw.length; i++) {
      const r = raw[i];
      if (!r || !r[2] || String(r[2]).trim()==='Hub Name') continue;
      const tc = Number(r[7]);
      if (!tc) continue;
      c2bRows.push({
        hub: String(r[2]||'').trim(),
        city: String(r[1]||'').trim(),
        zone: String(r[0]||'').trim(),
        category: String(r[3]||'').trim(),
        totalCapex: tc,
        infraCost: Number(r[8])||0,
      });
    }
  }

  // Parse 4 Year view sheet (prefer "4 Year view", fall back to Raman sheet)
  let ramanRows = null;
  const ramanSheetName = wb.SheetNames.find(n => /^4 year view$/i.test(n.trim()))
    || wb.SheetNames.find(n => n.toLowerCase().includes('4 year') || n.toLowerCase().includes('4yr') || n.toLowerCase().includes('raman'));
  if (ramanSheetName) {
    const rs = wb.Sheets[ramanSheetName];
    const raw = XLSX.utils.sheet_to_json(rs, {header:1, defval:null});
    // Find header row containing year labels like "2024" or "2024-25"
    let hi = raw.findIndex(r => r && r.some(c => String(c||'').includes('2024')));
    if (hi >= 0) {
      const hdr = raw[hi];
      // Map to 6 display columns: 2024-25, 2025-26, Actual 25-26, 2026-27, 2027-28, 2028-29
      // (skip "Actual 26-27" column if present)
      const yKeys = ['2024','2025-2','actual','2026','2027','2028'];
      const colIdx = yKeys.map(k => hdr.findIndex(c => String(c||'').toLowerCase().includes(k)));
      ramanRows = [];
      // Row just before the header contains budget totals (e.g. "All costs are in Lakhs" row)
      if (hi > 0) {
        const br = raw[hi-1];
        if (br) {
          const bd = colIdx.map(ci => ci>=0 ? (br[ci]===null||br[ci]===undefined ? null : Number(br[ci])||null) : null);
          ramanRows.push({label:'__budget__', isBudget:true, d:bd, isTotal:false, isCount:false, g:'budget'});
        }
      }
      for (let i = hi+1; i < raw.length; i++) {
        const r = raw[i];
        if (!r) continue;
        const label = String(r[0]||r[1]||'').trim();
        if (!label) continue;
        const d = colIdx.map(ci => ci>=0 ? (r[ci]===null||r[ci]===undefined ? null : Number(r[ci])||0) : null);
        const isTotal = label.toLowerCase().startsWith('total') || label.toLowerCase().includes('capex/year') || label.toLowerCase().includes('contingency');
        ramanRows.push({label, isTotal, isCount:!isTotal, d, g:'parsed'});
      }
    }
  }

  return { gsRows: gsRows.length ? gsRows : null, c2bRows: c2bRows.length ? c2bRows : null, ramanRows: ramanRows && ramanRows.length ? ramanRows : null };
}

// Parse waterfall values from the Summary/Capex Summary sheet
// Returns { gsEx, gsNw, infraEx, infraNw, ... } in Crores, or null if sheet not found
function parseWaterfallFromExcel(buffer) {
  try {
    const wb = XLSX.read(buffer, {type:'array'});
    const sName = wb.SheetNames.find(n => /summary|capex sum/i.test(n));
    if (!sName) return null;
    const raw = XLSX.utils.sheet_to_json(wb.Sheets[sName], {header:1, defval:null});
    // Find the header row that has "Existing" and "New" columns
    let hi = raw.findIndex(r => r && r.some(c => /existing/i.test(String(c||''))));
    if (hi < 0) return null;
    const hdr = raw[hi];
    // Prefer the "Existing Location" / "New Location" columns (already in Crores).
    // Fall back to the raw INR columns "Existing store Capex" / "New Store Capex" (divide later).
    let exCol = hdr.findIndex(c => /existing.*location/i.test(String(c||'')));
    if (exCol < 0) exCol = hdr.findIndex(c => /existing/i.test(String(c||'')));
    let nwCol = hdr.findIndex(c => /new.*location/i.test(String(c||'')));
    if (nwCol < 0) nwCol = hdr.findIndex(c => /new.*(hub|store|city)/i.test(String(c||'')));
    const totCol = hdr.findIndex((c,i) => i > nwCol && /total/i.test(String(c||'')));
    if (exCol < 0 || nwCol < 0) return null;
    // Build label→row map (skip the grand-total summary row at top)
    const lmap = {};
    for (let i = hi+1; i < raw.length; i++) {
      const r = raw[i];
      if (!r) continue;
      const lbl = String(r[0]||r[1]||'').trim().toLowerCase();
      if (!lbl) continue;
      // skip the single grand-total rollup row (contains multiple categories in label)
      if (lbl.includes('total gs') || lbl.includes('+ hrc') || lbl.includes('+ c2b')) continue;
      lmap[lbl] = {ex: Number(r[exCol])||0, nw: Number(r[nwCol])||0, tot: totCol>=0?Number(r[totCol])||0:0};
    }
    // startsWith match first (precise), then falls back to includes
    const g = key => {
      const lk = key.toLowerCase();
      const hit = Object.entries(lmap).find(([k]) => k.startsWith(lk))
               || Object.entries(lmap).find(([k]) => k.includes(lk));
      return hit ? hit[1] : {ex:0, nw:0, tot:0};
    };
    const gs = g('gs hub capex'); const hrc = g('hrc total'); const maint = g('total maintenance');
    const infra = g('infra cost'); const slot = g('slot marking'); const vm = g('vm');
    const init_ = g('new initiatives'); const it = g('it cost');
    const hrcCap = g('hrc capex'); const hrcIt = g('hrc it'); const hrcMt = g('hrc maintenance');
    const iMaint = g('infra maintenance'); const vmM = g('vm maintenance');
    const c2b = g('c2b capex');
    const office = g('new office capex');
    // Values come in Rupees from the Excel; divide by 10M to get Crores
    const CR = 10000000;
    const cr = v => v/CR;
    // If values look like they're already in Crores (< 100), use directly
    const isAlreadyCr = gs.ex < 100;
    const f = v => isAlreadyCr ? v : cr(v);
    return {
      gsEx:f(gs.ex), gsNw:f(gs.nw),
      infraEx:f(infra.ex), infraNw:f(infra.nw),
      slotEx:f(slot.ex), slotNw:f(slot.nw),
      vmEx:f(vm.ex), vmNw:f(vm.nw),
      initEx:f(init_.ex), initNw:f(init_.nw),
      itEx:f(it.ex), itNw:f(it.nw),
      hrcCap:f(hrcCap.ex||hrc.ex), hrcIt:f(hrcIt.ex), hrcMt:f(hrcMt.ex),
      hrcCapNw:f(hrcCap.nw), hrcItNw:f(hrcIt.nw), hrcMtNw:f(hrcMt.nw),
      mEx:f(maint.ex), mNw:f(maint.nw),
      imEx:f(iMaint.ex), imNw:f(iMaint.nw),
      vmMEx:f(vmM.ex), vmMNw:f(vmM.nw),
      c2bEx:f(c2b.ex), c2bNw:f(c2b.nw),
      office:f(office.tot||office.ex),
    };
  } catch(e) { return null; }
}

// ── Tooltip ───────────────────────────────────────────────────────────────

function TooltipBox({ tooltip }) {
  if (!tooltip.visible || !tooltip.items.length) return null;
  const x = Math.min(tooltip.x + 14, window.innerWidth - 310);
  const y = Math.max(10, Math.min(tooltip.y - 10, window.innerHeight - 220));
  const total = tooltip.items.filter(it=>it.amount!=null).reduce((s,it)=>s+it.amount,0);
  return (
    <div className="tooltip-box bg-gray-900 border border-gray-600 rounded-xl shadow-2xl p-3 text-xs min-w-[220px] max-w-[300px]"
      style={{left:x, top:y}}>
      <div className="text-[10px] text-gray-400 uppercase tracking-wider mb-2">{tooltip.col}</div>
      {tooltip.items.map((it,i) => (
        <div key={i} className="flex justify-between gap-3 py-0.5">
          <span className="text-gray-300">{it.label}</span>
          <span className="text-white font-semibold whitespace-nowrap">{it.amount!=null ? fmtAmt(it.amount) : ''}</span>
        </div>
      ))}
      {total > 0 && (
        <div className="flex justify-between gap-3 pt-1.5 mt-1.5 border-t border-gray-700">
          <span className="text-gray-400 font-semibold">Standard Total</span>
          <span className="text-[#4736FE] font-bold">{fmtAmt(total)}</span>
        </div>
      )}
    </div>
  );
}

    const h = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, []);
  const count = selected.size;
  return (
    <div className="relative" ref={ref}>
      <button onClick={()=>setOpen(o=>!o)}
        className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium border transition-colors
          ${count>0?'border-[#4736FE] bg-[#4736FE]/10 text-[#4736FE]':'border-gray-200 dark:border-gray-700 text-gray-500 dark:text-gray-400 hover:border-gray-300'}`}>
        <Ico n="filter" size={11}/>{label}{count>0&&` (${count})`}
      </button>
      {open && (
        <div className="absolute top-full mt-1 left-0 z-30 min-w-[170px] bg-white dark:bg-[#1a1a1a] border border-gray-200 dark:border-gray-700 rounded-xl shadow-xl p-2 max-h-64 overflow-y-auto fade-in">
          <div className="flex items-center justify-between px-1 pb-1 mb-1 border-b border-gray-100 dark:border-gray-800">
            <span className="text-[10px] font-semibold text-gray-400 uppercase tracking-wider">{label}</span>
            {count>0 && <button onClick={()=>onChange(new Set())} className="text-[10px] text-[#4736FE] hover:underline">Clear</button>}
          </div>
          {options.map(o => (
            <label key={o} className="flex items-center gap-2 px-2 py-1.5 rounded-lg hover:bg-gray-50 dark:hover:bg-white/[0.04] cursor-pointer">
              <input type="checkbox" checked={selected.has(o)}
                onChange={e=>{const s=new Set(selected);e.target.checked?s.add(o):s.delete(o);onChange(s);}}
                className="accent-[#4736FE] w-3.5 h-3.5"/>
              <span className="text-xs text-gray-600 dark:text-gray-300">{o}</span>
            </label>
          ))}
        </div>
      )}
    </div>
  );
}

function LoginModal({ onSuccess, onClose }) {
  const [user, setUser] = useState('');
  const [pass, setPass] = useState('');
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState('');
  function submit(e) {
    e.preventDefault();
    if (!user||!pass){setErr('Enter credentials.');return;}
    setErr('');setLoading(true);
    window.C24Uploader.verify({workerUrl:WORKER_URL,auth:{username:user,password:pass}})
      .then(()=>onSuccess({username:user,password:pass}))
      .catch(er=>setErr(er.status===401?'Wrong credentials.':'Error: '+(er.message||er)))
      .finally(()=>setLoading(false));
  }
  return (
    <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4" onClick={onClose}>
      <div className="bg-white dark:bg-[#1a1a1a] rounded-2xl shadow-2xl w-full max-w-sm p-6 fade-in" onClick={e=>e.stopPropagation()}>
        <div className="flex items-center gap-3 mb-4">
          <div className="w-9 h-9 rounded-xl bg-[#4736FE]/10 border border-[#4736FE]/30 flex items-center justify-center"><Ico n="lock" size={16} cls="text-[#4736FE]"/></div>
          <div><div className="font-bold text-sm">Login to upload</div><div className="text-xs text-gray-400">CARS24 credentials required</div></div>
          <button onClick={onClose} className="ml-auto w-7 h-7 rounded-full flex items-center justify-center text-gray-400 hover:bg-gray-100 dark:hover:bg-white/10"><Ico n="x" size={14}/></button>
        </div>
        <form onSubmit={submit} className="space-y-3">
          <input value={user} onChange={e=>setUser(e.target.value)} placeholder="Username" className="w-full px-3 py-2 text-sm rounded-lg border border-gray-200 dark:border-gray-700 bg-transparent focus:outline-none focus:border-[#4736FE]"/>
          <input type="password" value={pass} onChange={e=>setPass(e.target.value)} placeholder="Password" className="w-full px-3 py-2 text-sm rounded-lg border border-gray-200 dark:border-gray-700 bg-transparent focus:outline-none focus:border-[#4736FE]"/>
          {err && <p className="text-xs text-red-400">{err}</p>}
          <button type="submit" disabled={loading} className="w-full py-2 rounded-lg bg-[#4736FE] text-white text-sm font-semibold hover:bg-[#3829CC] disabled:opacity-50 flex items-center justify-center gap-2">
            {loading?<><Ico n="spin" size={14} cls="spin"/>Verifying…</>:'Login'}
          </button>
        </form>
      </div>
    </div>
  );
}

function useToast() {
  const [toasts, setToasts] = useState([]);
  const add = useCallback((msg, type='ok') => {
    const id = Date.now();
    setToasts(t=>[...t,{id,msg,type}]);
    setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),3500);
  },[]);
  return {toasts, add};
}
function ToastLayer({toasts}) {
  return <div className="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 items-center pointer-events-none">
    {toasts.map(t=><div key={t.id} className={`px-4 py-2.5 rounded-xl text-sm font-medium shadow-xl fade-in ${t.type==='ok'?'bg-green-500 text-white':'bg-red-500 text-white'}`}>{t.msg}</div>)}
  </div>;
}

    // C2B: New Yard + Office = City Expansion; Live + Replacement = Existing
    const isNewC2B = r => /new yard|office/i.test(r.category||'');
    const c2bEx = c2bData.filter(r=>!isNewC2B(r)).reduce((a,r)=>a+(r.totalCapex||0),0)/CR;
    const c2bNw = c2bData.filter(r=>isNewC2B(r)).reduce((a,r)=>a+(r.totalCapex||0),0)/CR;

function GSHubsTab({ gsData }) {

  }),[gsData]);

  const filtered = useMemo(()=>{
    let rows=gsData;

    if (fCat.size>0) rows=rows.filter(r=>fCat.has(r.category));
    if (fStage.size>0) rows=rows.filter(r=>fStage.has(r.stage));

      if (openGroups.has(g.key)) {
        g.subs.forEach(s=>cols.push({...s, inGroup:g.key}));

        cols.push({key:g.totalKey, label:g.label, tip:false, isGroupHead:true, groupKey:g.key});

              {/* Row 1: Totals */}
              <tr>
                <th className={`${thB} s-col w-44 text-left`}><span className="text-[#4736FE] font-bold">TOTALS — {filtered.length}</span></th>
                <th className={thB} colSpan="6"></th>
                {visCols.map(col=>(
                  <th key={'t-'+col.key} className={`${thB} text-right whitespace-nowrap ${col.key==='grandTotal'?'text-[#4736FE] font-bold':''}`}>
                    {totals[col.key]?fmtAmt(totals[col.key]):'—'}
                  </th>
                ))}
                <th className={thB}></th>
              </tr>
              {/* Row 2: Group labels with colSpan */}
              <tr>
                <th className={`${thB} s-col w-44`}></th>
                <th className={thB} colSpan="6"></th>
                {COL_GROUPS.map(g=>{
                  const isOpen = openGroups.has(g.key);
                  return (
                    <th key={'g-'+g.key} colSpan={isOpen ? g.subs.length : 1}
                      onClick={()=>toggleGroup(g.key)}
                      className={`${thB} text-center cursor-pointer select-none whitespace-nowrap
                        ${isOpen ? 'text-[#4736FE] bg-[#4736FE]/[0.06] border-b-2 border-[#4736FE]/50' : 'hover:text-[#4736FE]'}`}>
                      {g.label} <span className="text-[9px] font-bold">{isOpen ? '▲' : '▼'}</span>
                    </th>
                  );
                })}
                <th className={`${thB} text-right font-bold text-[#4736FE]`}>Grand Total</th>
                <th className={thB}></th>
              </tr>
              {/* Row 3: Column names */}
              <tr>
                {['Hub','City','Zone','Cat.','Stage','Parking','Slots'].map((h,i)=>(
                  <th key={'c-'+h} className={`${thB} ${i===0?'s-col w-44 ':''} text-left whitespace-nowrap`}>{h}</th>
                ))}
                {visCols.map(col=>{
                  if (col.isGroupHead) {
                    return <th key={'c-'+col.key} className={`${thB} text-right whitespace-nowrap text-gray-400`}>Total</th>;
                  }
                  const grp = COL_GROUPS.find(g=>g.key===col.inGroup);
                  const isFirst = grp?.subs[0].key===col.key;
                  const isLast = grp?.subs[grp.subs.length-1].key===col.key;
                  if (col.key === 'grandTotal') return <th key={'c-grand'} className={`${thB} text-right font-bold text-[#4736FE] whitespace-nowrap`}>Grand Total</th>;
                  return (
                    <th key={'c-'+col.key}
                      className={`${thB} text-right whitespace-nowrap bg-[#4736FE]/[0.03]
                        ${isFirst ? 'border-l border-[#4736FE]/30' : ''}
                        ${isLast ? 'border-r border-[#4736FE]/30' : ''}`}>
                      {col.label}
                    </th>
                  );
                })}
                <th className={`${thB} text-left text-gray-300`}>Cost Center</th>
              </tr>
            </thead>
            <tbody>
              {groupByCity && groups ? groups.map(([city, rows]) => {
                const collapsed = collapsedCities.has(city);
                const cityTotals={};
                visCols.forEach(c=>{cityTotals[c.key]=rows.reduce((s,r)=>s+(r[c.key]||0),0);});
                return (
                  <React.Fragment key={city}>
                    <tr className="group bg-gray-100 dark:bg-white/[0.06] border-b border-gray-200 dark:border-gray-700 cursor-pointer hover:bg-gray-200 dark:hover:bg-white/[0.09]"
                      onClick={()=>{const s=new Set(collapsedCities);collapsed?s.delete(city):s.add(city);setCollapsedCities(s);}}>
                      <td className="px-2 py-2 s-col w-44 font-bold text-xs text-[#4736FE] whitespace-nowrap truncate bg-gray-100 dark:bg-white/[0.06] group-hover:bg-gray-200 dark:group-hover:bg-white/[0.09]">
                        {collapsed?'▶':'▼'} {city} <span className="text-gray-400 font-normal ml-1">({rows.length})</span>
                      </td>
                      <td colSpan="6" className="px-2 py-2"></td>
                      {visCols.map(col=>(
                        <td key={col.key} className={`px-2 py-2 text-right text-xs font-bold ${col.key==='grandTotal'?'text-[#4736FE]':'text-gray-600 dark:text-gray-300'} whitespace-nowrap`}>
                          {cityTotals[col.key]?fmtAmt(cityTotals[col.key]):'—'}
                        </td>
                      ))}
                      <td className="px-2 py-2"></td>
                    </tr>
                    {!collapsed && rows.map((r,i)=><HubRow key={i} r={r} visCols={visCols} showTip={showTip} hideTip={hideTip} stageCls={stageCls}/>)}
                  </React.Fragment>
                );
              }) : filtered.map((r,i)=><HubRow key={i} r={r} visCols={visCols} showTip={showTip} hideTip={hideTip} stageCls={stageCls}/>)}
            </tbody>
          </table>
        </div>
      </div>
      <p className="text-[10px] text-gray-400 mt-2">💡 Click <span className="text-[#4736FE] font-bold">＋</span> on a column group header to expand sub-columns. Hover underlined amounts for assumption breakdown.</p>
    </div>
  );
}

function C2BTab({ c2bData }) {

  const catCls = {
    'New Yard':'bg-[#4736FE]/15 text-[#4736FE]',
    'Live':'bg-green-500/15 text-green-400',
    'Replacement':'bg-amber-500/15 text-amber-400',
  };

  const groups = useMemo(()=>{
    const key = groupBy;

      const k = r[key]||'—';

        <div className="bg-white dark:bg-white/[0.03] border border-gray-100 dark:border-gray-800 rounded-2xl px-5 py-4">
          <div className="text-xs text-gray-400 mb-1">New Yards</div>
          <div className="text-2xl font-bold">{fmtAmt(newYards.reduce((s,r)=>s+r.totalCapex,0))}</div>
          <div className="text-xs text-gray-400 mt-1">{newYards.length} hubs · ₹8.17L each</div>
        </div>
        <div className="bg-white dark:bg-white/[0.03] border border-gray-100 dark:border-gray-800 rounded-2xl px-5 py-4">
          <div className="text-xs text-gray-400 mb-1">Live Hub Upgrades</div>
          <div className="text-2xl font-bold">{fmtAmt(live.reduce((s,r)=>s+r.totalCapex,0))}</div>
          <div className="text-xs text-gray-400 mt-1">{live.length} hubs</div>

          <div className="text-xs text-gray-400 mb-1">Replacements</div>

  {metric:'C2B Parking Capex',     fy2425:5400000,fy2526:6000000,fy2627:24900000,fy2728:8400000,fy2829:9000000},
  {metric:'New Office Capex',      fy2425:0,fy2526:0,fy2627:140000000,fy2728:0,fy2829:0},
  {metric:'GS Hub Capex (Total)',  fy2425:0,fy2526:0,fy2627:191000000,fy2728:0,fy2829:0},
  {metric:'Total Capex (all)',     fy2425:22600000,fy2526:30960000,fy2627:457400000,fy2728:44700000,fy2829:45100000, isTotal:true},
];
const FY_YEARS = [{key:'fy2425',label:'FY 24-25\n(Plan)'},{key:'fy2526',label:'FY 25-26\n(Plan)'},{key:'fy2627',label:'FY 26-27\n(AOP)'},{key:'fy2728',label:'FY 27-28\n(Proj.)'},{key:'fy2829',label:'FY 28-29\n(Proj.)'}];

function FourYearPlanTab({ fourYearData }) {
  const COLS = [
    {idx:0, label:'2024-25',       thCls:'bg-purple-800 text-white',        tdCls:'text-purple-200'},
    {idx:1, label:'2025-26',       thCls:'bg-green-800 text-white',         tdCls:'text-green-200'},
    {idx:2, label:'Actual\n25-26', thCls:'bg-green-700/70 text-green-100',  tdCls:'text-green-300'},
    {idx:3, label:'2026-27',       thCls:'bg-[#4736FE] text-white',         tdCls:'text-[#a09eff] font-semibold'},
    {idx:4, label:'2027-28',       thCls:'bg-orange-700 text-white',        tdCls:'text-orange-200'},
    {idx:5, label:'2028-29',       thCls:'bg-gray-600 text-white',          tdCls:'text-gray-300'},
  ];
  const budgetEntry = fourYearData && fourYearData.find(r => r.isBudget);
  const COUNTS = budgetEntry ? budgetEntry.d : [1253, 2282, 1962, 1426, 379, null];

  const ROWS = (fourYearData ? fourYearData.filter(r => !r.isBudget && !/average capex/i.test(r.label||'')) : null) || [
    {g:'hubs',  label:'Opening no. of hubs',                      isCount:true,  d:[35,48,48,44,58,null]},
    {g:'hubs',  label:'New hubs opened',                          isCount:true,  d:[19,22,15,19,2,null]},
    {g:'hubs',  label:'Completely Revamped Hubs',                 isCount:true,  d:[10,11,10,2,1,null]},
    {g:'hubs',  label:'No. of hubs closed',                       isCount:true,  d:[6,20,19,5,1,null]},
    {g:'hubs',  label:'Closing number of hubs',                   isCount:true,  d:[48,50,44,58,59,59]},
{g:'new',   label:'Total Capex/Year for New Hubs',            isTotal:true,  d:[627,1227,811,1092,124,null]},
    {g:'vr',    label:'No. of VR/Studio',                         isCount:true,  d:[6,5,7,2,2,null]},
    {g:'vr',    label:'Total Capex/Year for VR',                  isTotal:true,  d:[138.07637,175,120,70,70,null]},
    {g:'hrc',   label:'No. of HRC',                               isCount:true,  d:[0,0,0,0,null,null]},
    {g:'hrc',   label:'Total Capex/Year for HRC',                 isTotal:true,  d:[0,0,0,0,null,null]},
    {g:'acad',  label:'No. of Academy',                           isCount:true,  d:[0,3,0,0,null,null]},
    {g:'acad',  label:'Total Capex/Year for Academy',             isTotal:true,  d:[0,60,0,0,null,null]},
    {g:'maj',   label:'No. of Major Upgrade',                     isCount:true,  d:[10,11,11,2,1,null]},
    {g:'maj',   label:'Total Capex/Year for Major Upgrades',      isTotal:true,  d:[211.08253,533,635,97,30,null]},
    {g:'min',   label:'No. of Minor Upgrades',                    isCount:true,  d:[19,27,17,32,29,null]},
    {g:'min',   label:'Total Capex/Year for Minor Upgrades',      isTotal:true,  d:[221.30025,164,336,115,104,null]},
    {g:'basic', label:'No. of Basic Upgrade (Capex Cost < 10L)',  isCount:true,  d:[0,0,0,null,null,null]},
    {g:'basic', label:'Total Capex/Year for Basic Upgrade',       isTotal:true,  d:[0,0,0,null,null,null]},
    {g:'maint', label:'No. of Maintenance (All Hubs)',            isCount:true,  d:[0,0,0,0,null,null]},
    {g:'maint', label:'Total Capex/Year for Maintenance',         isTotal:true,  d:[0,0,0,0,null,null]},
    {g:'clos',  label:'No. of Closure',                           isCount:true,  d:[12,19,19,2,1,null]},
    {g:'clos',  label:'Total Capex/Year for closure',             isTotal:true,  d:[55.4307,22.4,51,2,1,null]},
    {g:'four',  label:'Fourdoor',                                 isCount:true,  d:[0,0,1,0,null,null]},
    {g:'four',  label:'Total Capex/Year for Fourdoor',            isTotal:true,  d:[0,0,10,0,null,null]},
    {g:'cont',  label:'Total Contingency/Year for closure/Replacement', isTotal:true, d:[0,100,0,50,50,null]},
  ];

  // Totals are in Lakhs in Excel — convert to Cr (÷100) for display
  const fmtCell = (v, isTotal) => {
    if (v === null || v === undefined) return '—';
    if (v === 0 && !isTotal) return '—';
    if (v === 0 && isTotal) return '₹0';
    if (isTotal) { const cr = v / 100; return '₹' + (cr % 1 === 0 ? cr.toLocaleString() : cr.toFixed(2)) + ' Cr'; }
    return v;
  };
  const fmtBudget = v => { if (!v) return '—'; const cr = v/100; return '₹'+(cr%1===0?cr.toLocaleString():cr.toFixed(2))+' Cr'; };

  const thBase = "px-3 py-2.5 text-right text-xs font-bold whitespace-pre-line text-center";
  const tdBase = "px-3 py-2 text-right text-xs";

  return (
    <div className="fade-in space-y-4">
      <div className="bg-white dark:bg-white/[0.03] border border-gray-100 dark:border-gray-800 rounded-2xl overflow-hidden">
        <div className="px-4 py-3 border-b border-gray-100 dark:border-gray-800 flex items-center justify-between">
          <div className="font-semibold text-sm">4-Year Capex View</div>
          <div className="text-xs text-gray-400">Capex values in ₹ Crores</div>
        </div>
        <div className="tbl-wrap">
          <table className="w-full min-w-[820px]" style={{borderCollapse:'separate',borderSpacing:0}}>
            <thead>
              <tr>
                <th className="px-3 py-2.5 text-left text-xs font-bold bg-gray-800 text-gray-200 sticky top-0 z-20 s-col whitespace-nowrap">Type</th>
                {COLS.map(c=>(
                  <th key={c.idx} className={`${thBase} ${c.thCls} sticky top-0 z-10`}>{c.label}</th>
                ))}
              </tr>
              <tr>
                <td className="px-3 py-1.5 text-[10px] text-gray-400 bg-gray-50 dark:bg-[#1a1a1a] s-col font-semibold uppercase tracking-wider border-b border-gray-200 dark:border-gray-700">Total Budget (₹ Cr)</td>
                {COLS.map((c,i)=>(
                  <td key={i} className={`px-3 py-1.5 text-right text-[10px] font-bold bg-gray-50 dark:bg-[#1a1a1a] border-b border-gray-200 dark:border-gray-700 ${COUNTS[i]?'text-gray-600 dark:text-gray-300':'text-gray-300'}`}>
                    {fmtBudget(COUNTS[i])}
                  </td>
                ))}
              </tr>
            </thead>
            <tbody>
              {ROWS.map((row, ri) => {
                const isBlank = !row.label;
                if (isBlank) return <tr key={ri} className="h-2"><td colSpan={7} className="bg-gray-50 dark:bg-[#161616]"/></tr>;
                const isClosing = /closing number of hubs/i.test(row.label);
                const prevGroup = ri > 0 ? ROWS[ri-1].g : null;
                const isGroupBorder = prevGroup && prevGroup !== row.g && ri > 0;
                const borderCls = isGroupBorder ? 'border-t-2 border-gray-200 dark:border-gray-700' : 'border-t border-gray-50 dark:border-gray-800/40';
                if (row.isTotal) return (
                  <tr key={ri} className={`${borderCls} bg-gray-50 dark:bg-white/[0.02]`}>
                    <td className={`px-3 py-2.5 text-xs font-bold s-col bg-gray-50 dark:bg-[#1a1a1a] whitespace-nowrap`}>{row.label}</td>
                    {COLS.map(c=>(
                      <td key={c.idx} className={`${tdBase} font-bold ${c.idx===3?'text-[#4736FE]':c.tdCls}`}>
                        {fmtCell(row.d[c.idx], true)}
                      </td>
                    ))}
                  </tr>
                );
                if (isClosing) return (
                  <tr key={ri} className={`${borderCls} bg-amber-500/10 dark:bg-amber-500/10`}>
                    <td className="px-3 py-2 text-xs font-bold s-col text-amber-600 dark:text-amber-400 whitespace-nowrap">{row.label} <span className="text-[9px] font-normal opacity-70">= next FY opening</span></td>
                    {COLS.map(c=>(
                      <td key={c.idx} className={`${tdBase} font-bold text-amber-600 dark:text-amber-400`}>
                        {fmtCell(row.d[c.idx], false)}
                      </td>
                    ))}
                  </tr>
                );
                return (
                  <tr key={ri} className={`${borderCls} hover:bg-gray-50 dark:hover:bg-white/[0.02]`}>
                    <td className="px-3 py-2 text-xs text-gray-500 dark:text-gray-400 s-col bg-white dark:bg-[#111] whitespace-nowrap">{row.label}</td>
                    {COLS.map(c=>(
                      <td key={c.idx} className={`${tdBase} text-gray-400 dark:text-gray-500`}>
                        {fmtCell(row.d[c.idx], false)}
                      </td>
                    ))}
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
      <p className="text-[10px] text-gray-400">FY 24-25 &amp; 25-26 are reference years. FY 26-27 is current AOP. FY 27-28/28-29 are projections. All capex values in ₹ Crores. Hub counts are units.</p>
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────────────────

function App() {
  const [gsData, setGsData] = useState(HARDCODED_GS);
  const [c2bData, setC2bData] = useState(HARDCODED_C2B);
  const [fourYearData, setFourYearData] = useState(null);
  const [waterfallData, setWaterfallData] = useState(null);
  const [dataSource, setDataSource] = useState('hardcoded');
  const [tab, setTab] = useState('summary');
  const [theme, setTheme] = useState(()=>{try{return localStorage.getItem('c24-theme')||'dark';}catch{return'dark';}});
  const [auth, setAuth] = useState(null);
  const [loginOpen, setLoginOpen] = useState(false);
  const [uploading, setUploading] = useState(false);
  const uploadRef = useRef();
  const {toasts, add:toast} = useToast();

  useEffect(()=>{
    const cc = new URLSearchParams(window.location.search).get('costCenter');
    if (cc) setTab('hubs');
  },[]);

  // Try to load from Cloudflare on mount
  useEffect(()=>{
    if (location.protocol==='file:') return;
    window.C24Uploader.fetchText(WORKER_URL + BUDGET_PATH + '.csv', {cache:'no-store'})
      .then(text=>{
        const j = JSON.parse(text);
        if (j.gs && j.gs.length) { setGsData(j.gs); setC2bData(j.c2b||HARDCODED_C2B); if (j.wf) setWaterfallData(j.wf); if (j.fy) setFourYearData(j.fy); setDataSource('cloudflare'); toast('✓ Budget data loaded from Cloudflare','ok'); }
      })
      .catch(()=>{}); // fallback to hardcoded silently
  },[]);

  function toggleTheme() {
    const next=theme==='dark'?'light':'dark';
    setTheme(next);
    try{localStorage.setItem('c24-theme',next);}catch{}
    if(next==='dark')document.documentElement.classList.add('dark');
    else document.documentElement.classList.remove('dark');
  }

  function handleUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    setUploading(true);
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const buf = new Uint8Array(ev.target.result);
        const { gsRows, c2bRows, ramanRows } = parseExcel(buf);
        if (!gsRows) { toast('Could not parse GS Capex AOP sheet','err'); setUploading(false); e.target.value=''; return; }
        setGsData(gsRows);
        if (c2bRows) setC2bData(c2bRows);
        if (ramanRows) setFourYearData(ramanRows);
        const wfParsed = parseWaterfallFromExcel(buf);
        if (wfParsed) setWaterfallData(wfParsed);
        setDataSource('uploaded');
        toast(`✓ Parsed ${gsRows.length} GS hubs${c2bRows?` + ${c2bRows.length} C2B hubs`:''}`, 'ok');

        // Save to Cloudflare if authenticated
        if (auth) {
          const wfParsedForSave = parseWaterfallFromExcel(buf);
          const jsonText = JSON.stringify({gs:gsRows, c2b:c2bRows||HARDCODED_C2B, wf:wfParsedForSave||null, fy:ramanRows||null, uploadedAt:new Date().toISOString()});
          window.C24Uploader.upload({csvText:jsonText, workerUrl:WORKER_URL, toolPath:BUDGET_PATH, auth})
            .then(()=>{ setDataSource('cloudflare'); toast('✓ Saved to Cloudflare — all users will see updated data','ok'); })
            .catch(er=>{ if(er.status===401){toast('Session expired','err');}else toast('Parsed OK but CF save failed: '+(er.message||er),'err'); });
        }
      } catch(err) {
        toast('Parse error: '+err.message,'err');
      } finally {
        setUploading(false); e.target.value='';
      }
    };
    reader.readAsArrayBuffer(file);
  }

  const tabs=[['summary','📊 Summary'],['hubs','🏢 GS Hubs'],['c2b','🚗 C2B'],['nso','🏗 NSO Pipeline'],['4yr','📅 4 Year View'],['assumptions','📐 Assumptions']];
  const srcBadge={hardcoded:'Hardcoded',uploaded:'Uploaded',cloudflare:'Live (CF)'}[dataSource];
  const srcCls={hardcoded:'text-gray-400',uploaded:'text-amber-400',cloudflare:'text-green-400'}[dataSource];

  return (
    <div className="min-h-screen flex flex-col">
      <header className="flex items-center justify-between px-5 py-3.5 border-b border-gray-200 dark:border-gray-800 sticky top-0 z-20 bg-gray-50/90 dark:bg-[#111]/90 backdrop-blur-md">
        <div className="flex items-center gap-3">
          <a href="/" className="flex items-center gap-1.5 text-sm text-gray-400 hover:text-[#4736FE] transition-colors"><Ico n="back" size={14}/> C24 Hub</a>
          <div className="w-px h-5 bg-gray-200 dark:bg-gray-700"/>
          <a href="/pr-po-tracker/" className="hidden sm:block text-sm text-gray-400 hover:text-[#4736FE] font-medium">📋 PR/PO</a>
          <div className="hidden sm:block w-px h-5 bg-gray-200 dark:bg-gray-700"/>
          <span className="font-bold text-sm">Capex Budget FY 26-27</span>
          <span className={`text-[10px] font-semibold ${srcCls}`}>{srcBadge}</span>
        </div>
        <div className="flex items-center gap-2">
          <div className="hidden md:flex items-center gap-1 mr-1">
            <a href="https://cars24.slack.com/team/U07PN5VRWCB" target="_blank" rel="noopener noreferrer"
              className="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-medium text-gray-400 hover:text-[#4A154B] dark:hover:text-purple-300 hover:bg-[#4A154B]/10 transition-all" title="Slack — Vicky Bhardwaj">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M5.042 15.165a2.528 2.528 0 0 1-2.52 2.523A2.528 2.528 0 0 1 0 15.165a2.527 2.527 0 0 1 2.522-2.52h2.52v2.52zm1.271 0a2.527 2.527 0 0 1 2.521-2.52 2.527 2.527 0 0 1 2.521 2.52v6.313A2.528 2.528 0 0 1 8.834 24a2.528 2.528 0 0 1-2.521-2.522v-6.313zM8.834 5.042a2.528 2.528 0 0 1-2.521-2.52A2.528 2.528 0 0 1 8.834 0a2.528 2.528 0 0 1 2.521 2.522v2.52H8.834zm0 1.271a2.528 2.528 0 0 1 2.521 2.521 2.528 2.528 0 0 1-2.521 2.521H2.522A2.528 2.528 0 0 1 0 8.834a2.528 2.528 0 0 1 2.522-2.521h6.312zm10.122 2.521a2.528 2.528 0 0 1 2.522-2.521A2.528 2.528 0 0 1 24 8.834a2.528 2.528 0 0 1-2.522 2.521h-2.522V8.834zm-1.268 0a2.528 2.528 0 0 1-2.523 2.521 2.527 2.527 0 0 1-2.52-2.521V2.522A2.527 2.527 0 0 1 15.165 0a2.528 2.528 0 0 1 2.523 2.522v6.312zm-2.523 10.122a2.528 2.528 0 0 1 2.523 2.522A2.528 2.528 0 0 1 15.165 24a2.527 2.527 0 0 1-2.52-2.522v-2.522h2.52zm0-1.268a2.527 2.527 0 0 1-2.52-2.523 2.526 2.526 0 0 1 2.52-2.52h6.313A2.527 2.527 0 0 1 24 15.165a2.528 2.528 0 0 1-2.522 2.523h-6.313z"/></svg>
              Vicky
            </a>
            <a href="https://mail.google.com/mail/?view=cm&to=vicky.bhardwaj@cars24.com" target="_blank" rel="noopener noreferrer"
              className="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-medium text-gray-400 hover:text-[#EA4335] dark:hover:text-red-400 hover:bg-[#EA4335]/10 transition-all" title="Email Vicky Bhardwaj">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M24 5.457v13.909c0 .904-.732 1.636-1.636 1.636h-3.819V11.73L12 16.64l-6.545-4.91v9.273H1.636A1.636 1.636 0 0 1 0 19.366V5.457c0-2.023 2.309-3.178 3.927-1.964L5.455 4.64 12 9.548l6.545-4.91 1.528-1.145C21.69 2.28 24 3.434 24 5.457z"/></svg>
              Mail
            </a>
            <div className="w-px h-4 bg-gray-200 dark:bg-gray-700 mx-1"/>
          </div>
          <input ref={uploadRef} type="file" accept=".xlsx,.xls" className="hidden" onChange={handleUpload}/>
          {auth ? (
            <>
              <button onClick={()=>uploadRef.current.click()} disabled={uploading}
                className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold bg-[#4736FE] text-white hover:bg-[#3829CC] disabled:opacity-50">
                {uploading?<><Ico n="spin" size={12} cls="spin"/>Parsing…</>:<><Ico n="upload" size={12}/>Update Excel</>}
              </button>
              <button onClick={()=>setAuth(null)} className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs border border-gray-200 dark:border-gray-700 text-gray-500 hover:text-red-400 hover:border-red-400/50">
                <Ico n="logout" size={12}/> Logout
              </button>
            </>
          ) : (
            <button onClick={()=>setLoginOpen(true)} className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs border border-gray-200 dark:border-gray-700 text-gray-500 hover:border-[#4736FE] hover:text-[#4736FE]">
              <Ico n="upload" size={12}/> Upload Excel
            </button>
          )}
          <button onClick={toggleTheme} className="w-8 h-8 rounded-lg border border-gray-200 dark:border-gray-700 flex items-center justify-center text-gray-400 hover:text-[#4736FE] hover:border-[#4736FE]">
            {theme==='dark'?<Ico n="sun" size={14}/>:<Ico n="moon" size={14}/>}
          </button>
        </div>
      </header>

      <main className="flex-1 px-4 sm:px-6 py-5 max-w-screen-2xl mx-auto w-full">
        <div className="flex items-center gap-1 mb-5 flex-wrap">
          {tabs.map(([t,l])=>(
            <button key={t} onClick={()=>setTab(t)}
              className={`px-4 py-2 rounded-lg text-sm font-medium transition-colors ${tab===t?'bg-[#4736FE] text-white':'text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-white/[0.05]'}`}>
              {l}
            </button>
          ))}
        </div>
        {tab==='summary'    && <SummaryTab gsData={gsData} c2bData={c2bData} waterfallData={waterfallData}/>}
        {tab==='hubs'       && <GSHubsTab gsData={gsData}/>}
        {tab==='c2b'        && <C2BTab c2bData={c2bData}/>}
        {tab==='nso'        && <NSOTab gsData={gsData}/>}
        {tab==='4yr'        && <FourYearPlanTab fourYearData={fourYearData}/>}
        {tab==='assumptions'&& <AssumptionsTab/>}
      </main>

      {loginOpen && <LoginModal onSuccess={creds=>{setAuth(creds);setLoginOpen(false);toast('✓ Logged in','ok');}} onClose={()=>setLoginOpen(false)}/>}
      <ToastLayer toasts={toasts}/>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
